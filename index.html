            'Ibuprofen': ['#E8D5B7', '#D4BFA0'],
            'Cetirizine': ['#D4E0D8', '#B8C9BE'],
            'Amoxicillin': ['#F5E3D4', '#E8CDB8'],
            'Cough Syrup': ['#F0D4B0', '#E0BC8A'],
            'Oral Rehydration': ['#D4E8E0', '#B8D4C8'],
            'Vitamin C': ['#F5E0B0', '#E8CC8A'],
            'Multivitamins': ['#D4E8D0', '#B8D4B0'],
            'Antiseptic': ['#D0E0E8', '#B0C8D4'],
            'Hydrocortisone': ['#E8DDE0', '#D4C4C8'],
            'Salbutamol': ['#D0E0F0', '#B0C8E0'],
            'Echinacea': ['#D4E8D8', '#B0C8B8'],
            'Ginger': ['#E8D8B8', '#D4C4A0'],
        };

        function getMedEmoji(name) {
            for (const [key, val] of Object.entries(MED_EMOJI)) {
                if (name.includes(key)) return val;
            }
            return '💊';
        }

        function getMedGradient(name) {
            for (const [key, val] of Object.entries(MED_GRADIENT)) {
                if (name.includes(key)) return val;
            }
            return ['#D4D4D4', '#B8B8B8'];
        }

        function medPicture(m, size, extraClass) {
            size = size || 72;
            if (m.images && m.images.length) {
                return `<div class="med-picture ${extraClass||''}" style="width:${size}px;height:${size}px;border:2px solid rgba(255,255,255,0.4);background-image:url('${m.images[0]}');background-size:cover;background-position:center;" role="img" aria-label="Photo of ${esc(m.name)}"></div>`;
            }
            const emoji = getMedEmoji(m.name);
            const [c1, c2] = getMedGradient(m.name);
            const label = m.category;
            return `<div class="med-picture ${extraClass||''}" style="width:${size}px;height:${size}px;background:linear-gradient(145deg,${c1},${c2});border:2px solid rgba(255,255,255,0.4);" role="img" aria-label="Picture of ${esc(m.name)}">
            <span class="med-emoji">${emoji}</span>
            <span class="med-pic-label">${esc(label)}</span>
          </div>`;
        }

        function medPictureLg(m, labelOverride, imageOverride) {
            const photo = imageOverride || (m.images && m.images.length ? m.images[0] : null);
            if (photo) {
                return `<div class="med-picture med-picture-lg" style="border:2px solid rgba(255,255,255,0.4);background-image:url('${photo}');background-size:cover;background-position:center;">
            <span class="med-pic-label">${esc(labelOverride || m.category)}</span>
          </div>`;
            }
            const emoji = getMedEmoji(m.name);
            const [c1, c2] = getMedGradient(m.name);
            const label = labelOverride || m.category;
            return `<div class="med-picture med-picture-lg" style="background:linear-gradient(145deg,${c1},${c2});border:2px solid rgba(255,255,255,0.4);">
            <span class="med-emoji">${emoji}</span>
            <span class="med-pic-label">${esc(label)}</span>
          </div>`;
        }

        /* ---------- Product gallery (images + video placeholder) ---------- */
        function medGalleryShots(m) {
            if (m.images && m.images.length) {
                return m.images.map((src, i) => ({ type: 'image', label: 'Photo ' + (i + 1), src }))
                    .concat([{ type: 'video', label: 'How to use (video)' }]);
            }
            return [
                { type: 'image', label: 'Front' },
                { type: 'image', label: 'Label' },
                { type: 'image', label: 'In Use' },
                { type: 'video', label: 'How to use (video)' },
            ];
        }
        function medVideoView(m) {
            const [c1, c2] = getMedGradient(m.name);
            const playing = state.gallery.playing;
            return `<div class="med-picture med-picture-lg gallery-video ${playing?'playing':''}" style="background:linear-gradient(145deg,${c1},${c2});border:2px solid rgba(255,255,255,0.4);" onclick="App.toggleGalleryVideo()">
                <button class="gallery-play-btn" title="${playing?'Pause':'Play'} video" onclick="event.stopPropagation();App.toggleGalleryVideo()">${icon(playing?'pause':'play',24)}</button>
                <span class="med-pic-label" style="position:absolute;bottom:12px;">${playing?'Playing':'How to use'}</span>
              </div>`;
        }
        function medGalleryHtml(m) {
            const shots = medGalleryShots(m);
            const idx = Math.min(state.gallery.index || 0, shots.length - 1);
            const shot = shots[idx];
            const [c1, c2] = getMedGradient(m.name);
            const emoji = getMedEmoji(m.name);
            const main = shot.type === 'video' ? medVideoView(m) : medPictureLg(m, shot.label, shot.src);
            const thumbs = shots.map((s, i) => `
                <button class="gallery-thumb ${i===idx?'active':''}" title="${esc(s.label)}" onclick="App.setGalleryIndex(${i})">
                  <div class="gallery-thumb-pic" style="${s.src ? `background-image:url('${s.src}');background-size:cover;background-position:center;` : `background:linear-gradient(145deg,${c1},${c2});`}">
                    ${s.type==='video' ? `<span class="gallery-thumb-play">${icon('play',12)}</span>` : (s.src ? '' : `<span class="gallery-thumb-emoji">${emoji}</span>`)}
                  </div>
                </button>`).join('');
            return `<div class="gallery">
                <div class="gallery-main">${main}</div>
                <div class="gallery-thumbs">${thumbs}</div>
              </div>`;
        }
        function productDescription(m) {
            if (m.description) return m.description;
            return `${m.name} is a trusted ${(m.category||'').toLowerCase()} product carried by ${pharmacyName(m.pharmacyId)}. Ask the pharmacist if you have questions about dosage or suitability.`;
        }
        function productSpecs(m) {
            if (m.specs) return m.specs;
            return { Category: m.category, 'Requires Prescription': m.prescription ? 'Yes' : 'No',
                'Sold By': pharmacyName(m.pharmacyId) };
        }
        function specsHtml(m) {
            const specs = productSpecs(m);
            const rows = Object.entries(specs).map(([k, v]) => `<div class="spec-row"><span class="spec-key">${esc(k)}</span><span class="spec-val">${esc(String(v))}</span></div>`).join('');
            return `<div class="spec-table">${rows}</div>`;
        }

        function flowerMarker(kind) {
            const map = {
                todo: { fill: 'var(--stone-dark)', stroke: 'var(--stone-dark)', op: .6, r: 'stroke' },
                current: { fill: 'var(--yarrow-tint)', stroke: 'var(--yarrow)', op: 1, r: 'fill' },
                done: { fill: 'var(--sage)', stroke: 'var(--sage-dark)', op: 1, r: 'fill' },
                bloom: { fill: 'var(--yarrow)', stroke: '#B8912F', op: 1, r: 'fill' },
            };
            const c = map[kind];
            const petals = c.r === 'stroke' ?
                `<circle cx="12" cy="7.6" r="3" fill="none" stroke="${c.stroke}" stroke-width="1.3"/><circle cx="16.4" cy="12" r="3" fill="none" stroke="${c.stroke}" stroke-width="1.3"/><circle cx="12" cy="16.4" r="3" fill="none" stroke="${c.stroke}" stroke-width="1.3"/><circle cx="7.6" cy="12" r="3" fill="none" stroke="${c.stroke}" stroke-width="1.3"/>` :
                `<circle cx="12" cy="7.6" r="3" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1"/><circle cx="16.4" cy="12" r="3" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1"/><circle cx="12" cy="16.4" r="3" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1"/><circle cx="7.6" cy="12" r="3" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1"/>`;
            return `<svg class="flower" viewBox="0 0 24 24" width="24" height="24" style="opacity:${c.op}">${petals}<circle cx="12" cy="12" r="2.6" fill="${c.stroke}"/></svg>`;
        }

        function illustration(kind) {
            if (kind === 'mortar') {
                return `<svg viewBox="0 0 64 64" width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 32c0 10 7 18 16 18s16-8 16-18"/><path d="M11 32h42"/><path d="M40 8 26 30"/><circle cx="41" cy="7" r="3"/><path d="M23 32c1-4 4-7 9-7"/>
        </svg>`;
            }
            return `<svg viewBox="0 0 64 64" width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 55V19"/><path d="M32 19c0-8 6-14 14-14 0 8-6 14-14 14Z"/><path d="M32 30c0-7-5-12-13-12 0 7 5 12 13 12Z"/><path d="M32 41c0-6-5-10-12-10 0 6 5 10 12 10Z"/>
          </svg>`;
        }

        function timeGreeting() {
            const h = new Date().getHours();
            if (h < 12) return { text: 'Good morning', ic: 'sprout' };
            if (h < 18) return { text: 'Good afternoon', ic: 'flower' };
            return { text: 'Good evening', ic: 'leaf' };
        }

        /* ---------- Helpers ---------- */
        function money(n) { return currencySymbol() + Number(n).toFixed(2); }

        /* ---------- Phase 3 helpers ---------- */
        function settings() { return DB.settings; }

        function currencySymbol() {
            const c = CURRENCIES[DB.settings.currency];
            return c ? c.symbol : '₱';
        }

        /* A listing is only shown to shoppers when staff have it switched on. */
        function productStatus(m) {
            if ((m.status || 'active') === 'inactive') return 'inactive';
            return m.stock === 0 ? 'out' : 'active';
        }
        const PRODUCT_STATUS_LABEL = { active: 'Active', inactive: 'Inactive', out: 'Out of stock' };
        const PRODUCT_STATUS_BADGE = { active: 'badge-active', inactive: 'badge-disabled', out: 'badge-cancelled' };
        function isListed(m) { return (m.status || 'active') === 'active'; }

        function lowStockThreshold(m) {
            const t = m.lowStockThreshold;
            return (t === undefined || t === null || isNaN(t)) ? DB.settings.lowStockThreshold : t;
        }
        function isLowStock(m) { return m.stock > 0 && m.stock <= lowStockThreshold(m); }
        function pharmacyMedicines(phId) { return DB.medicines.filter(m => m.pharmacyId === phId); }
        function lowStockMedicines(phId) { return pharmacyMedicines(phId).filter(isLowStock); }
        function outOfStockMedicines(phId) { return pharmacyMedicines(phId).filter(m => m.stock === 0); }

        function deliveryFeeFor(subtotal) {
            const s = DB.settings;
            if (s.freeDeliveryOver > 0 && subtotal >= s.freeDeliveryOver) return 0;
            return Number(s.deliveryFee) || 0;
        }
        function enabledPaymentMethods() { return PAYMENT_METHODS.filter(pm => DB.settings.payments[pm.id]); }

        function pharmacyReturns(phId) { return DB.returns.filter(r => r.pharmacyId === phId); }
        function orderReturn(orderId) { return DB.returns.find(r => r.orderId === orderId); }
        const RETURN_LABEL = { requested: 'Requested', approved: 'Approved', refunded: 'Refunded',
            rejected: 'Rejected' };
        const RETURN_BADGE = { requested: 'badge-pending', approved: 'badge-confirmed', refunded: 'badge-completed',
            rejected: 'badge-cancelled' };

        /* Notification templates are per-pharmacy so each shop can word things its own way. */
        function notifTemplates(phId) {
            if (!DB.notifTemplates[phId]) {
                DB.notifTemplates[phId] = {};
                NOTIF_EVENTS.forEach(e => { DB.notifTemplates[phId][e.id] = { enabled: true, text: e.text }; });
                sbSaveNotifTemplates(phId, DB.notifTemplates[phId]);
            }
            return DB.notifTemplates[phId];
        }

        function renderTemplate(text, ctx) {
            return String(text).replace(/\{(\w+)\}/g, (_, k) => (ctx[k] !== undefined ? ctx[k] : '{' + k + '}'));
        }

        function sendTemplatedNotification(phId, eventId, ctx, type) {
            const tpl = notifTemplates(phId)[eventId];
            if (!tpl || !tpl.enabled) return;
            const ph = pharmacy(phId);
            const full = Object.assign({ pharmacy: ph ? ph.name : 'the pharmacy' }, ctx);
            const text = renderTemplate(tpl.text, full);
            if (ctx.customerId) pushNotification(ctx.customerId, type || 'order', text);
            logNotification(phId, eventId, ctx.customerId, text, 'automated');
        }

        function logNotification(phId, eventId, customerId, text, kind) {
            const row = { id: 'log' + (counters.log++), pharmacyId: phId, event: eventId,
                customerId, text, kind: kind || 'automated', at: new Date() };
            DB.notificationLog.unshift(row);
            sbUpsert('notificationLog', row);
        }

        function notifyOrderEvent(o, eventId, extra) {
            const c = customer(o.customerId);
            sendTemplatedNotification(o.pharmacyId, eventId, Object.assign({
                customerId: o.customerId,
                customer: c ? c.name.split(' ')[0] : 'there',
                order: o.id.replace('o', ''),
                status: STATUS_LABEL[o.status] || o.status,
            }, extra || {}));
        }

        function pharmacyCustomerIds(phId) {
            return [...new Set(DB.orders.filter(o => o.pharmacyId === phId).map(o => o.customerId))]
                .filter(id => customer(id));
        }

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;' } [c])); }

        function fmtDate(d) { return new Date(d).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric',
                minute: '2-digit' }); }

        function stockState(s) { return s === 0 ? 'out' : s <= 10 ? 'low' : 'in'; }

        function stockDotClass(s) { return 'dot dot-' + stockState(s); }

        function stockText(s) { return s === 0 ? 'Out of stock' : s <= 10 ? ('Low stock — ' + s + ' left') : (s +
                ' in stock'); }

        function pharmacy(id) { return DB.pharmacies.find(p => p.id === id); }

        function medicine(id) { return DB.medicines.find(m => m.id === id); }

        function customer(id) { return DB.customers.find(c => c.id === id); }

        function staffMember(id) { return DB.staff.find(s => s.id === id); }

        function admin(id) { return DB.admins.find(a => a.id === id); }

        function order(id) { return DB.orders.find(o => o.id === id); }

        function thread(id) { return DB.threads.find(t => t.id === id); }

        function unreadForCustomer(custId) { return DB.threads.filter(t => t.customerId === custId && t.unreadForCustomer)
                .length; }

        function unreadForStaffPharmacy(pharmacyId) { return DB.threads.filter(t => t.pharmacyId === pharmacyId && t
                .unreadForStaff).length; }

        function isWishlisted(custId, medId) { const c = customer(custId); return !!(c && c.wishlist && c.wishlist.includes(
                medId)); }

        function custNotifications(custId) { return DB.notifications.filter(n => n.customerId === custId).sort((a, b) => b.at -
                a.at); }

        function unreadNotifCount(custId) { return DB.notifications.filter(n => n.customerId === custId && !n.read).length; }

        function pushNotification(custId, type, text) {
            const row = { id: 'n' + (counters.notif++), customerId: custId, type, text, read: false,
                at: new Date() };
            DB.notifications.unshift(row);
            sbUpsert('notifications', row);
        }

        function currentCustomer() { return customer(state.session.customer); }

        function currentStaff() { return staffMember(state.session.staff); }

        function currentAdmin() { return admin(state.session.admin); }

        function currentStaffPharmacy() { const s = currentStaff(); return s ? pharmacy(s.pharmacyId) : null; }

        /* ---- Phase 4: pharmacy staff/admin helpers ---- */
        function pharmacyStaffList(pharmacyId) { return DB.staff.filter(s => s.pharmacyId === pharmacyId); }
        function pharmacyOwners(pharmacyId) { return DB.staff.filter(s => s.pharmacyId === pharmacyId && s.isOwner); }
        function isPharmacyOwner() { const s = currentStaff(); return !!(s && s.isOwner); }

        /* ---- Phase 4: audit trail ---- */
        function auditActorLabel() {
            if (state.activeRole === 'admin') { const a = currentAdmin(); return 'Admin · ' + (a ? a.name : 'Unknown'); }
            if (state.activeRole === 'staff') { const s = currentStaff(); const ph = currentStaffPharmacy();
                return (s && s.isOwner ? 'Pharmacy Admin · ' : 'Staff · ') + (s ? s.name : 'Unknown') + (ph ? ' (' + ph.name + ')' : ''); }
            return 'System';
        }
        function logAudit(action) {
            const row = { id: 'audit' + (counters.audit++), at: new Date(), actor: auditActorLabel(), action };
            DB.auditLog.unshift(row);
            if (DB.auditLog.length > 300) DB.auditLog.length = 300;
            sbUpsert('auditLog', row);
        }

        function orderTotal(o) { return o.items.reduce((sum, it) => sum + it.price * it.qty, 0); }
        function orderPaymentLabel(o) { return o.paymentLabel || 'Card'; }
        function orderPaymentIcon(o) {
            const pm = PAYMENT_METHODS.find(p => p.id === (o.paymentMethod || 'card'));
            return icon(pm ? pm.icon : 'card', 13);
        }

        function pharmacyName(id) { const p = pharmacy(id); return p ? p.name : 'Unknown pharmacy'; }

        function customerName(id) { const c = customer(id); return c ? c.name : 'Removed customer'; }

        /* Drop a delisted medicine from carts and wishlists so nothing renders a missing item. */
        function purgeMedicineReferences(medId) {
            DB.customers.forEach(c => {
                if (c.wishlist) c.wishlist = c.wishlist.filter(w => w !== medId);
            });
            Object.keys(state.carts).forEach(custId => {
                const cart = state.carts[custId];
                cart.items = cart.items.filter(it => it.medId !== medId);
                if (!cart.items.length) delete state.carts[custId];
            });
        }

        function toast(msg, type) {
            const box = document.createElement('div');
            box.className = 'toast' + (type ? ' ' + type : '');
            box.textContent = msg;
            document.getElementById('toastContainer').appendChild(box);
            setTimeout(() => { box.remove(); }, 3200);
        }

        /* ---------- Render engine ---------- */
        function update() {
            const active = document.activeElement;
            const activeId = active && active.id ? active.id : null;
            const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
            const selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;
            document.getElementById('app').innerHTML = buildApp();
            if (activeId) {
                const el = document.getElementById(activeId);
                if (el) {
                    el.focus();
                    if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (
                        e) {} }
                }
            }
            if (state.staff.view === 'profile') { setTimeout(initPharmacyMapIfVisible, 0); }
            setTimeout(initCustomerPharmacyMaps, 0);
        }

        document.addEventListener('click', (e) => {
            if (state.notifPanelOpen && !e.target.closest('.notif-wrap')) { state.notifPanelOpen = false;
                update(); }
        });

        function buildApp() {
            const isAdmin = state.activeRole === 'admin' && state.session.admin;
            return topbar() + subnav() + `<main class="${isAdmin?'admin-main':''}">` + mainContent() + '</main>' +
                footerHtml() + lightboxHtml();
        }

        function lightboxHtml() {
            if (!state.lightbox) return '';
            const zoomed = state.lightbox.zoomed;
            return `<div class="lightbox-overlay" onclick="App.closeLightbox()">
            <button class="lightbox-close" title="Close" onclick="event.stopPropagation();App.closeLightbox()">✕</button>
            <button class="lightbox-zoombtn" onclick="event.stopPropagation();App.toggleLightboxZoom()">${zoomed?'&#8722; Zoom out':'&#43; Zoom in'}</button>
            <div class="lightbox-inner"><img class="${zoomed?'zoomed':'fit'}" src="${state.lightbox.src}" alt="Prescription photo" onclick="event.stopPropagation();App.toggleLightboxZoom()"></div>
            <div class="lightbox-hint">Click the photo to ${zoomed?'zoom back out':'zoom in'}</div>
          </div>`;
        }

        function footerHtml() {
            const loggedIn = state.activeRole && state.session[state.activeRole];
            return `<footer class="app-footer">
              ${!loggedIn ? `<div class="footer-links">
                <a href="#" onclick="event.preventDefault();App.goStaticPage('about')">${esc(DB.pages.about.title)}</a>
                <a href="#" onclick="event.preventDefault();App.goStaticPage('contact')">${esc(DB.pages.contact.title)}</a>
                <a href="#" onclick="event.preventDefault();App.goStaticPage('faqs')">FAQs</a>
                <a href="#" onclick="event.preventDefault();App.goStaticPage('privacy')">${esc(DB.pages.privacy.title)}</a>
              </div>` : ''}
              <div>CarePoint — "The Neighborhood Apothecary."</div>
            </footer>`;
        }

        /* ---------- Top bar ---------- */
        function topbar() {
            let cartBtn = '';
            let msgBtn = '';
            let notifBtn = '';
            if (state.activeRole === 'customer' && state.session.customer) {
                const n = cartCount();
                cartBtn =
                    `<button class="satchel-btn" id="satchelIcon" title="Your Satchel" aria-label="Your Satchel, ${n} item${n===1?'':'s'}" onclick="App.setView('customer','cart')">${icon('cart',18)}${n?`<span class="satchel-count">${n}</span>`:''}</button>`;
                const unread = unreadForCustomer(state.session.customer);
                msgBtn =
                    `<button class="msg-btn" title="Messages" aria-label="Messages${unread?', unread messages':''}" onclick="App.setView('customer','messages')">${icon('envelope',16)}${unread?`<span class="msg-dot"></span>`:''}</button>`;
                const unreadN = unreadNotifCount(state.session.customer);
                notifBtn = `<div class="notif-wrap">
                <button class="bell-btn" title="Notifications" aria-label="Notifications${unreadN?', '+unreadN+' unread':''}" onclick="event.stopPropagation();App.toggleNotifPanel()">${icon('bell',16)}${unreadN?`<span class="bell-dot"></span>`:''}</button>
                ${state.notifPanelOpen ? notifPanel() : ''}
              </div>`;
            } else if (state.activeRole === 'staff' && state.session.staff) {
                const ph = currentStaffPharmacy();
                const unread = unreadForStaffPharmacy(ph.id);
                msgBtn =
                    `<button class="msg-btn" title="Messages" aria-label="Messages${unread?', unread messages':''}" onclick="App.setView('staff','messages')">${icon('envelope',16)}${unread?`<span class="msg-dot"></span>`:''}</button>`;
            }

            let userHtml = '';
            const loggedInId = state.activeRole ? state.session[state.activeRole] : null;
            if (loggedInId) {
                let name = '';
                if (state.activeRole === 'customer') name = currentCustomer().name;
                if (state.activeRole === 'staff') name = currentStaff().name + (currentStaff().isOwner ? ' (Admin)' : '') + ' · ' + currentStaffPharmacy().name;
                if (state.activeRole === 'admin') name = currentAdmin().name;
                userHtml = `<div class="user-chip">
                <span class="name">${esc(name)}</span>
                ${cartBtn}
                ${notifBtn}
                ${msgBtn}
                <button class="btn-link" onclick="App.logout()">Log out</button>
              </div>`;
            }

            const brandClick = loggedInId ? '' : ` onclick="App.goPublic('landing')" style="cursor:pointer;"`;
            return `<header class="topbar"><div class="topbar-inner">
              <div class="brand"${brandClick}><span class="brand-mark">${icon('leaf',18)}</span> <span>CarePoint<span class="brand-tag">The Neighborhood Apothecary</span></span></div>
              ${loggedInId ? userHtml : guestNav()}
            </div></header>`;
        }

        /* Visitors get their own nav so the site is browsable without an account. */
        function guestNav() {
            const v = state.publicView;
            return `<div class="guest-nav">
              <button class="navlink ${v==='landing'?'active':''}" onclick="App.goPublic('landing')">Home</button>
              <button class="navlink ${(v==='catalog'||v==='medicine')?'active':''}" onclick="App.goPublic('catalog')">Browse</button>
              <button class="navlink ${v==='auth'?'active':''}" onclick="App.goAuth('login')">Log in</button>
              <button class="btn btn-primary btn-sm" onclick="App.goAuth('register')">Sign up</button>
            </div>`;
        }

        function notifPanel() {
            const list = custNotifications(state.session.customer);
            return `<div class="notif-panel" onclick="event.stopPropagation();">
              <div class="notif-panel-head">
                <strong>Notifications</strong>
                ${list.length ? `<button class="btn-link" style="font-size:11px;" onclick="App.markAllNotifsRead()">Mark all read</button>` : ''}
              </div>
              ${list.length ? list.map(n=>`<div class="notif-item ${n.read?'':'unread'}">
                  ${n.read?'':'<span class="row-unread-dot" title="Unread"></span>'}${esc(n.text)}
                  <div class="notif-time">${fmtDate(n.at)}</div>
                </div>`).join('') : `<div class="notif-empty">All caught up — no notifications.</div>`}
            </div>`;
        }

        /* ---------- Sub nav ---------- */
        function subnav() {
            const role = state.activeRole;
            if (!state.session[role]) return '';
            let tabs = [];
            if (role === 'customer') {
                const unreadCount = unreadForCustomer(state.session.customer);
                const wishCount = (currentCustomer().wishlist || []).length;
                tabs = [
                    ['home', 'Shop'],
                    ['wishlist', 'Wishlist' + (wishCount ? ` <span class="badge-count">${wishCount}</span>` : '')],
                    ['cart', 'Satchel' + (cartCount() ? ` <span class="badge-count">${cartCount()}</span>` : '')],
                    ['orders', 'My Orders'],
                    ['messages', 'Messages' + (unreadCount ? ` <span class="badge-count">${unreadCount}</span>` : '')],
                    ['profile', 'Profile']
                ];
            } else if (role === 'staff') {
                const ph = currentStaffPharmacy();
                const pending = DB.orders.filter(o => o.pharmacyId === ph.id && o.status === 'pending').length;
                const openMsgs = unreadForStaffPharmacy(ph.id);
                const lowStock = lowStockMedicines(ph.id).length + outOfStockMedicines(ph.id).length;
                const openReturns = pharmacyReturns(ph.id).filter(r => r.status === 'requested').length;
                tabs = [
                    ['orders', 'Workbench' + (pending ? ` <span class="badge-count">${pending}</span>` : '')],
                    ['listings', 'The Shelf'],
                    ['inventory', 'Inventory' + (lowStock ? ` <span class="badge-count">${lowStock}</span>` : '')],
                    ['returns', 'Returns' + (openReturns ? ` <span class="badge-count">${openReturns}</span>` : '')],
                    ['messages', 'Counter' + (openMsgs ? ` <span class="badge-count">${openMsgs}</span>` : '')],
                    ['sales', 'Sales'],
                    ['notices', 'Notices'],
                    ...(isPharmacyOwner() ? [['team', 'Team']] : []),
                    ['profile', 'Profile']
                ];
            } else if (role === 'admin') {
                const pendingApprovals = DB.staff.filter(s => s.status === 'pending').length;
                const openFlags = DB.flags.filter(f => f.status === 'open').length;
                tabs = [
                    ['approvals', 'Registry' + (pendingApprovals ? ` <span class="badge-count">${pendingApprovals}</span>` :
                        '')],
                    ['accounts', 'Accounts'],
                    ['catalog', 'Herbal Index'],
                    ['orders', 'All Orders'],
                    ['flags', 'Flags' + (openFlags ? ` <span class="badge-count">${openFlags}</span>` : '')],
                    ['reports', 'Tally'],
                    ['content', 'Content'],
                    ['audit', 'Audit Trail'],
                    ['settings', 'Settings']
                ];
            }
            const activeView = state[role].view;
            return `<nav class="subnav"><div class="subnav-inner">` +
                tabs.map(([v, label]) =>
                    `<button class="${activeView===v?'active':''}" onclick="App.setView('${role}','${v}')">${label}</button>`
                    ).join('') +
                `</div></nav>`;
        }

        /* ================= PUBLIC (no login required) ================= */
        function publicScreen() {
            if (state.publicView === 'auth') return authScreen();
            if (state.publicView === 'catalog') return publicCatalog();
            if (state.publicView === 'medicine') return publicMedicineDetail();
            if (state.publicView === 'page') return publicStaticPage();
            return landingPage();
        }

        /* CMS-managed static pages (About, Contact, Privacy) and FAQs, editable by the site admin. */
        function publicStaticPage() {
            const key = state.publicPageKey;
            const back = `<p style="margin:0 0 14px;"><button class="btn-link" onclick="App.goPublic('landing')">&larr; Back to CarePoint</button></p>`;
            if (key === 'faqs') {
                return `<div class="auth-wrap">${back}<div class="card">
                  <h2 class="section-title" style="margin-top:0;">Frequently Asked Questions</h2>
                  ${DB.faqs.length ? DB.faqs.map(f=>`<div style="padding:12px 0;border-bottom:1px solid var(--stone);">
                      <strong style="font-family:var(--font-display);">${esc(f.q)}</strong>
                      <p style="margin:6px 0 0;color:var(--walnut-soft);">${esc(f.a)}</p>
                    </div>`).join('') : `<p class="hint">No FAQs published yet.</p>`}
                </div></div>`;
            }
            const p = DB.pages[key];
            if (!p) return `<div class="auth-wrap">${back}<div class="card empty">Page not found.</div></div>`;
            return `<div class="auth-wrap">${back}<div class="card">
              <h2 class="section-title" style="margin-top:0;">${esc(p.title)}</h2>
              <p style="white-space:pre-wrap;color:var(--walnut-soft);">${esc(p.body)}</p>
            </div></div>`;
        }

        function platformStats() {
            const openPharmacies = DB.pharmacies.filter(p => p.status === 'approved');
            const meds = DB.medicines.filter(m => {
                const ph = pharmacy(m.pharmacyId);
                return ph && ph.status === 'approved' && isListed(m);
            });
            const rated = meds.filter(m => medReviews(m.id).length);
            const avg = rated.length ?
                rated.reduce((s, m) => s + medRatingAvg(m.id), 0) / rated.length : 0;
            return { pharmacies: openPharmacies.length, meds: meds.length, avg,
                delivered: DB.orders.filter(o => o.status === 'completed').length };
        }

        function publicMedicines() {
            return DB.medicines.filter(m => {
                const ph = pharmacy(m.pharmacyId);
                return ph && ph.status === 'approved' && isListed(m);
            });
        }

                      <div class="hero-stat"><div class="n">${stats.meds}</div><div class="l">Remedies on the shelf</div></div>
                      <div class="hero-stat"><div class="n">${stats.avg ? stats.avg.toFixed(1) : '\u2014'}</div><div class="l">Average rating</div></div>
                    </div>
                  </div>
                  <div class="hero-art">
                    <div class="hero-jar">${illustration('mortar')}</div>
                    <div class="hero-chip-card hero-chip-1">${icon('cart',15)} Ready for pickup in 20 min</div>
                    <div class="hero-chip-card hero-chip-2">${starRow(5,null,13)} Rated by real customers</div>
                    <div class="hero-chip-card hero-chip-3">${icon('quill',15)} Ask a pharmacist anything</div>
                  </div>
                </div>
              </section>

              ${activePromos.length ? `<section class="landing-section" style="padding-top:0;">
                <div class="grid grid-2">
                  ${activePromos.map(p=>`<div class="apo-note"><p><strong>${esc(p.title)}</strong> — ${esc(p.text)}</p></div>`).join('')}
                </div>
              </section>` : ''}

              <section class="landing-section">
                <div class="landing-head">
                  <span class="landing-kicker">Shelves</span>
                  <h2>Find it by what ails you</h2>
                  <p>Every category is stocked by pharmacies in your neighborhood.</p>
                </div>
                <div class="cat-grid">
                  ${CATEGORIES.map(c=>{
                    const n = publicMedicines().filter(m=>m.category===c).length;
                    return `<button class="cat-tile" onclick="App.browseCategory('${esc(c)}')">
                      <div class="ring">${icon(CAT_ICON[c]||'leaf',22)}</div>
                      <div class="nm">${esc(c)}</div>
                      <div class="ct">${n} item${n===1?'':'s'}</div>
                    </button>`;
                  }).join('')}
                </div>
              </section>

              <section class="landing-section">
                <div class="landing-head">
                  <span class="landing-kicker">Best loved</span>
                  <h2>What the neighborhood reaches for</h2>
                  <p>Top-rated remedies you can order the moment you sign in.</p>
                </div>
                <div class="masonry">${featured.map(publicMedCard).join('')}</div>
                <div style="text-align:center;margin-top:22px;">
                  <button class="btn-hero-ghost" onclick="App.goPublic('catalog')">See the full shelf \u2192</button>
                </div>
              </section>

              <section class="landing-section">
                <div class="landing-head">
                  <span class="landing-kicker">How it works</span>

                </div>
                <div class="steps-grid">
                  <div class="step-card"><div class="step-n">1</div><h4>Browse the shelf</h4><p>Search live stock and prices from approved pharmacies near you \u2014 no account required.</p></div>
                  <div class="step-card"><div class="step-n">2</div><h4>Order or ask</h4><p>Fill your satchel for pickup or delivery, or send a prescription photo to the pharmacist.</p></div>
                  <div class="step-card"><div class="step-n">3</div><h4>Receive & rate</h4><p>Track your order from pending to ready. Once you receive it, rate the medicine for your neighbors.</p></div>
                </div>
              </section>

              <section class="landing-section">
                <div class="landing-head">
                  <span class="landing-kicker">Neighborhood apothecaries</span>
                  <h2>Real counters, real pharmacists</h2>
                </div>
                <div class="masonry">
                  ${openPharmacies.map(p=>`<div class="card" style="padding:18px;">
                    <div class="row-between">
                      <div style="display:flex;align-items:center;gap:8px;"><span style="color:var(--terracotta);">${icon('building',18)}</span><strong style="font-family:var(--font-display);font-size:15.5px;">${esc(p.name)}</strong></div>
                      <span class="badge badge-active">${icon('leaf',11)} Open</span>
                    </div>
                    <div class="hint">${esc(p.location)}</div>

                    <div style="margin-top:8px;font-size:12px;color:var(--walnut-faint);">${DB.medicines.filter(m=>m.pharmacyId===p.id && !m.prescription).length} over-the-counter items</div>

                  <span class="landing-kicker">Verified ratings</span>
                  <h2>Only from people who received the order</h2>
                  <p>Nobody can rate a remedy until their order is complete.</p>
                </div>
                <div class="quote-grid">
                  ${topReviews.map(r=>{

                    return `<div class="quote-card">

                  <button class="btn-hero" onclick="App.goAuth('register')">Create your account</button>

        /* Guest version of a product card \u2014 same look, ordering asks for a login. */

            const ph = pharmacy(m.pharmacyId);
            const avg = medRatingAvg(m.id);
            const cnt = medReviews(m.id).length;
            return `<div class="med-card" onclick="App.openPublicMedicine('${m.id}')">
                <div class="med-card-top">
                  ${medPicture(m,72)}
                  <div style="min-width:0;">
                    <span class="med-cat">${catIcon(m.category)} ${esc(m.category)}</span>
                    <div class="med-name">${esc(m.name)}</div>
                    <div style="margin-top:3px;">${starRow(avg,cnt,12)}</div>
                  </div>
                </div>
                <div class="med-pharmacy">${icon('building',12)} ${esc(ph ? ph.name : 'Pharmacy')}${m.brand ? ' · ' + esc(m.brand) : ''}</div>
                ${m.prescription ? `<div class="stock-line">${icon('quill',13)} Rx required</div>` : `<div class="stock-line"><span class="${stockDotClass(m.stock)}"></span>${stockText(m.stock)}</div>`}
                <div class="med-bottom">
                  <div class="med-price">${money(m.price)}</div>

            const approvedPharmacies = DB.pharmacies.filter(p => p.status === 'approved');

              <h2 class="section-title" style="margin-top:12px;">The full shelf</h2>

              <div class="card">
                <div class="field" style="margin-bottom:12px;">
                  <input type="text" id="publicSearchInput" placeholder="Search remedies, pharmacies\u2026" value="${esc(state.search.query)}" oninput="App.setSearchQuery(this.value)">
                </div>
                <div class="chip-row" style="margin-bottom:12px;">
                  <button class="chip ${state.search.category==='All'?'active':''}" onclick="App.setSearchField('category','All')">All</button>
                  ${CATEGORIES.map(c=>`<button class="chip ${state.search.category===c?'active':''}" onclick="App.setSearchField('category','${esc(c)}')">${catIcon(c)} ${esc(c)}</button>`).join('')}

                  <div class="field" style="max-width:280px;">

                    <select onchange="App.setSearchField('pharmacy', this.value)">

                  </div>
                  <div class="field" style="max-width:220px;">
                    <label>Brand</label>
                    <select onchange="App.setSearchField('brand', this.value)">
                      <option value="All" ${state.search.brand==='All'?'selected':''}>All</option>
                      ${allBrands().map(b=>`<option value="${esc(b)}" ${state.search.brand===b?'selected':''}>${esc(b)}</option>`).join('')}
                    </select>
                  </div>
                  <div class="field" style="max-width:200px;">
                    <label>Sort</label>
                    <select onchange="App.setSearchField('sort', this.value)">
                      <option value="newest" ${state.search.sort==='newest'?'selected':''}>Newest</option>
                      <option value="popularity" ${state.search.sort==='popularity'?'selected':''}>Popular</option>
                      <option value="priceLow" ${state.search.sort==='priceLow'?'selected':''}>Price Low</option>
                      <option value="priceHigh" ${state.search.sort==='priceHigh'?'selected':''}>Price High</option>
                      <option value="name" ${state.search.sort==='name'?'selected':''}>Name A\u2013Z</option>
                      <option value="brand" ${state.search.sort==='brand'?'selected':''}>Brand A\u2013Z</option>

                  </div>
                  ${(state.search.category!=='All'||state.search.pharmacy!=='All'||state.search.brand!=='All'||state.search.query)

              </div>
              <div class="row-between" style="margin:22px 0 12px;">
                <h3 style="font-family:var(--font-display);font-size:16px;margin:0;color:var(--walnut-soft);">On the Shelf</h3>

              </div>
              <div class="masonry">
                ${meds.length ? meds.map(publicMedCard).join('') : `<div class="empty" style="grid-column:1/-1;">${illustration('mortar')}<div class="empty-title">Nothing matches</div>Try a different search or category.</div>`}
              </div>`;
        }

        function publicMedicineDetail() {
            const m = medicine(state.publicMedId);
            if (!m) return `<div class="empty">Not found. <button class="btn-link" onclick="App.goPublic('catalog')">Back to the shelf</button></div>`;

            return `<button class="btn-link" onclick="App.goPublic('catalog')">&larr; Back to the shelf</button>
                <div class="card" style="margin-top:14px;max-width:580px;">
                  <span class="med-cat">${catIcon(m.category)} ${esc(m.category)}</span>
                  ${medGalleryHtml(m)}
                  <h2 class="section-title" style="margin-top:0;margin-bottom:6px;">${esc(m.name)}</h2>
                  <div style="margin-bottom:10px;">${starRow(avg, reviews.length, 15)}</div>
                  <p class="section-sub" style="margin-top:10px;">Sold by <strong>${esc(ph ? ph.name : 'a pharmacy')}</strong>${m.brand ? ` &middot; Brand: <strong>${esc(m.brand)}</strong>` : ''}</p>
                  <div class="row-between" style="margin:16px 0;">
                    <div class="med-price" style="font-size:23px;">${money(m.price)}</div>

                  <button class="btn-hero" onclick="App.guestPrompt()">${icon('cart',16)} Log in to order</button>

        /* ---------- Main router ---------- */
        function mainContent() {
            const role = state.activeRole;
            if (!role || !state.session[role]) return publicScreen();
            if (role === 'customer') return customerView();
            if (role === 'staff') return staffView();
            if (role === 'admin') return adminView();
            return '';
        }

        /* ================= AUTH ================= */
        function authScreen() {
            const view = state.authView;
            const tabs = `<div class="auth-tabs">
                <button class="${view==='login'?'active':''}" onclick="App.setAuthView('login')">Log In</button>
                <button class="${view==='register'?'active':''}" onclick="App.setAuthView('register')">Register</button>
              </div>`;
            let body = '';
            if (view === 'login') body = loginForm();
            else if (view === 'register') body = customerRegisterForm();
            else if (view === 'registerPharmacy') body = staffRegisterForm();

            const footNote = view === 'registerPharmacy' ?
                `<p class="hint" style="text-align:center;margin-top:14px;"><a href="#" onclick="event.preventDefault();App.setAuthView('register')" style="color:var(--terracotta-dark);font-weight:600;">&larr; Back</a></p>` :
                view === 'register' ?
                `<p class="hint" style="text-align:center;margin-top:14px;">Own a pharmacy? <a href="#" onclick="event.preventDefault();App.setAuthView('registerPharmacy')" style="color:var(--terracotta-dark);font-weight:600;">Register it here</a>.</p>` :
                `<p class="hint" style="text-align:center;margin-top:14px;">Need an account? <a href="#" onclick="event.preventDefault();App.setAuthView('register')" style="color:var(--terracotta-dark);font-weight:600;">Create one</a>.</p>`;

            return `<div class="auth-wrap">
                <p style="margin:0 0 10px;"><button class="btn-link" onclick="App.goPublic('landing')">&larr; Keep browsing without an account</button></p>
                <div class="card">
                  <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">${icon('leaf',30)}<h2 class="section-title" style="margin:0;">CarePoint</h2></div>
                  <p class="section-sub">${view==='registerPharmacy' ? 'Tell us about your pharmacy to apply.' : 'Log in or create an account.'}</p>
                  ${view!=='registerPharmacy' ? tabs : ''}
                  ${body}
                  ${footNote}
                </div></div>`;
        }

              <div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
              <button class="btn btn-primary btn-block" onclick="App.login()">Log In</button>
            `;
        }

        function customerRegisterForm() {
            return `
              <div class="field"><label>Full Name</label><input type="text" id="regName" placeholder="Juan Dela Cruz"></div>
              <div class="field"><label>Email</label><input type="email" id="regEmail" placeholder="you@example.com"></div>
              <div class="field"><label>Password</label><input type="password" id="regPassword" placeholder="Create a password"></div>
              <button class="btn btn-primary btn-block" onclick="App.registerCustomer()">Create Account</button>

        function staffRegisterForm() {
            return `

        /* ================= CUSTOMER ================= */
        function customerView() {
            const v = state.customer.view;
            if (v === 'home') return customerHome();
            if (v === 'medicine') return customerMedicineDetail();
            if (v === 'wishlist') return customerWishlist();
            if (v === 'cart') return customerCart();
            if (v === 'checkout') return customerCheckout();
            if (v === 'orders') return customerOrders();
            if (v === 'orderDetail') return customerOrderDetail();
            if (v === 'messages') return customerMessages();
            if (v === 'thread') return threadView('customer');
            if (v === 'profile') return customerProfile();
            return '';
        }

        /* Unique, alphabetized list of brands currently on the shelf (approved
           pharmacies, listed products only) — feeds the customer Brand filter. */
        function allBrands() {
            const set = new Set();
            DB.medicines.forEach(m => {
                const ph = pharmacy(m.pharmacyId);
                if (ph && ph.status === 'approved' && isListed(m) && m.brand) set.add(m.brand);
            });
            return Array.from(set).sort((a, b) => a.localeCompare(b));
        }

        function filteredMedicines() {
            const q = state.search.query.trim().toLowerCase();
            const min = parseFloat(state.search.priceMin);
            const max = parseFloat(state.search.priceMax);
            let list = DB.medicines.filter(m => {
                const ph = pharmacy(m.pharmacyId);
                if (!ph || ph.status !== 'approved') return false;
                if (!isListed(m)) return false;
                if (state.search.category !== 'All' && m.category !== state.search.category) return false;
                if (state.search.pharmacy !== 'All' && m.pharmacyId !== state.search.pharmacy) return false;
                if (state.search.brand && state.search.brand !== 'All' && m.brand !== state.search.brand) return false;
                if (!isNaN(min) && m.price < min) return false;
                if (!isNaN(max) && m.price > max) return false;
                if (!q) return true;
                return m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q) || ph.name
                .toLowerCase().includes(q);
            });
            const sort = state.search.sort;
            if (sort === 'priceLow') list = list.slice().sort((a, b) => a.price - b.price);
            else if (sort === 'priceHigh') list = list.slice().sort((a, b) => b.price - a.price);
            else if (sort === 'name') list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
            else if (sort === 'brand') list = list.slice().sort((a, b) => (a.brand || '').localeCompare(b.brand || ''));
            else if (sort === 'popularity') list = list.slice().sort((a, b) => (b.sold || 0) - (a.sold || 0));
            else list = list.slice().sort((a, b) => b.addedAt - a.addedAt);
            return list;
        }

                      ${approvedPharmacies.map(p=>`<option value="${p.id}" ${state.search.pharmacy===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
                    </select>
                  </div>
                  <div class="field" style="max-width:220px;">
                    <label>Brand</label>
                    <select onchange="App.setSearchField('brand', this.value)">

                    <select onchange="App.setSearchField('sort', this.value)">
                      <option value="newest" ${state.search.sort==='newest'?'selected':''}>Newest</option>
                      <option value="popularity" ${state.search.sort==='popularity'?'selected':''}>Popular</option>
                      <option value="priceLow" ${state.search.sort==='priceLow'?'selected':''}>Price Low</option>
                      <option value="priceHigh" ${state.search.sort==='priceHigh'?'selected':''}>Price High</option>
                      <option value="name" ${state.search.sort==='name'?'selected':''}>Name A–Z</option>
                      <option value="brand" ${state.search.sort==='brand'?'selected':''}>Brand A–Z</option>
                    </select>
                  </div>
                  <div class="field">
                    <label>Price (₱)</label>
                    <div class="price-range-inputs">
                      <input type="number" min="0" inputmode="numeric" placeholder="Min" value="${esc(state.search.priceMin)}" oninput="App.setSearchField('priceMin', this.value)">
                      <span>–</span>
                      <input type="number" min="0" inputmode="numeric" placeholder="Max" value="${esc(state.search.priceMax)}" oninput="App.setSearchField('priceMax', this.value)">
                    </div>
                  </div>
                  ${(state.search.category!=='All'||state.search.pharmacy!=='All'||state.search.brand!=='All'||state.search.priceMin||state.search.priceMax||state.search.query)
                    ? `<button class="btn btn-ghost btn-sm" onclick="App.clearFilters()">Clear</button>` : ''}
                </div>
              </div>
              ${hasRxResults ? `<div class="apo-note"><p>Some items need a prescription — message the pharmacist to ask.</p></div>` : ''}
              <h3 style="font-family:var(--font-display);font-size:16px;margin:22px 0 12px;color:var(--walnut-soft);">Neighborhood Apothecaries</h3>
              <div class="masonry">
                ${approvedPharmacies.map(p=>`<div class="card" style="padding:16px;">
                    <div class="row-between">
                      <div style="display:flex;align-items:center;gap:8px;"><span style="color:var(--terracotta);">${icon('building',18)}</span><strong style="font-family:var(--font-display);font-size:15px;">${esc(p.name)}</strong></div>
                      <span class="badge badge-active">${icon('leaf',11)} Open</span>
                    </div>
                    <div class="hint">${esc(p.location)} · ${esc(p.hours)}</div>
                    <div style="margin-top:6px;font-size:12px;color:var(--walnut-faint);">${DB.medicines.filter(m=>m.pharmacyId===p.id && !m.prescription).length} OTC items</div>
                  </div>`).join('')}
              </div>
              <div class="row-between" style="margin:22px 0 0;">
                <h3 style="font-family:var(--font-display);font-size:16px;margin:0;color:var(--walnut-soft);">On the Shelf</h3>
                <span class="results-count" style="margin:0;">${meds.length} result${meds.length===1?'':'s'}</span>
              </div>
              <div class="masonry" style="margin-top:12px;">
                ${meds.length ? meds.map(medCard).join('') : `<div class="empty" style="grid-column:1/-1;">${illustration('mortar')}<div class="empty-title">Nothing matches</div>Try a different search or category.</div>`}
              </div>
            `;

        function medCard(m) {
            const ph = pharmacy(m.pharmacyId);
            const wished = isWishlisted(state.session.customer, m.id);
            const avg = medRatingAvg(m.id);
            const cnt = medReviews(m.id).length;
            return `<div class="med-card" onclick="App.openMedicine('${m.id}')">
                <button class="med-wish-btn ${wished?'saved':''}" title="${wished?'Remove':'Save'}" aria-pressed="${wished}" onclick="event.stopPropagation();App.toggleWishlist('${m.id}')">${heartIcon(wished,16)}</button>

                    <div class="med-name">${esc(m.name)}</div>

        function customerWishlist() {
            const c = currentCustomer();
            const items = (c.wishlist || []).map(id => medicine(id)).filter(Boolean);
            if (items.length === 0) {

            }
            return `<h2 class="section-title">Wishlist</h2><p class="section-sub">${items.length} item${items.length===1?'':'s'} saved.</p><div class="masonry">${items.map(medCard).join('')}</div>`;

            if (!m) return `<div class="empty">Not found. <button class="btn-link" onclick="App.setView('customer','home')">Back</button></div>`;

            const wished = isWishlisted(state.session.customer, m.id);
            const reviews = medReviews(m.id).slice().sort((a, b) => b.at - a.at);
            const avg = medRatingAvg(m.id);
            return `<button class="btn-link" onclick="App.setView('customer','home')">&larr; Back</button>
                <div class="card" style="margin-top:14px;max-width:580px;">
                  <div class="row-between">
                    <span class="med-cat">${catIcon(m.category)} ${esc(m.category)}</span>
                    <button class="med-wish-btn ${wished?'saved':''}" style="position:static;box-shadow:none;" onclick="App.toggleWishlist('${m.id}')">${heartIcon(wished,18)}</button>
                  </div>
                  ${medGalleryHtml(m)}
                  <h2 class="section-title" style="margin-top:0;margin-bottom:6px;">${esc(m.name)}</h2>
                  <div style="margin-bottom:10px;">${starRow(avg, reviews.length, 15)}</div>
                  <p class="section-sub" style="margin-top:10px;">Sold by ${ph ? `<a href="#" onclick="event.preventDefault();App.setSearchField('pharmacy','${ph.id}');App.setView('customer','home')" style="color:var(--terracotta-dark);font-weight:700;border-bottom:1.5px dashed var(--terracotta);">${esc(ph.name)}</a>` : esc(pharmacyName(m.pharmacyId))}${m.brand ? ` &middot; Brand: <a href="#" onclick="event.preventDefault();App.setSearchField('brand','${esc(m.brand)}');App.setView('customer','home')" style="color:var(--terracotta-dark);font-weight:700;border-bottom:1.5px dashed var(--terracotta);">${esc(m.brand)}</a>` : ''}</p>
                  ${pharmacyMapHtml(ph, 'medDetailPharmMap')}
                  <div class="row-between" style="margin:16px 0;">
                    <div class="med-price" style="font-size:23px;">${money(m.price)}</div>

                  </div>

                    <div class="apo-note"><p>This needs a prescription. Message the pharmacist to ask.</p></div>
                    <button class="btn btn-outline" style="margin-top:8px;" onclick="App.newPrescriptionInquiry('${m.id}')">${icon('quill',15)} Ask the pharmacist</button>
                  ` : `
                    <button class="btn btn-primary" ${m.stock===0?'disabled':''} onclick="App.addToCart('${m.id}', this)">${m.stock===0?'Out of stock':'Add to Satchel'}</button>

                      <div class="review-head">
                        <span class="review-name">${esc(customer(r.customerId) ? customer(r.customerId).name : 'Customer')}</span>
                        ${starRow(r.rating, null, 12)}
                      </div>
                      <div class="review-date">${fmtDate(r.at)}</div>
                    </div>`).join('') : `<p class="hint">No ratings yet — be the first to rate!</p>`}
                </div>
                `;
        }

        /* -------------------- REVIEW FORM (no comments) -------------------- */
        function reviewFormIfEligible(medId) {
            const custId = state.session.customer;
            if (!custId) return '';

            // Check if the user has a COMPLETED order containing this product AND hasn't reviewed it for that order yet.
            const eligibleOrder = DB.orders.find(o =>
                o.customerId === custId &&
                o.status === 'completed' &&
                o.items.some(it => it.medId === medId) &&
                !DB.reviews.some(r => r.customerId === custId && r.medId === medId && r.orderId === o.id)
            );

            if (!eligibleOrder) {
                const hasOpenOrder = DB.orders.some(o => o.customerId === custId && o.status !== 'cancelled' &&
                    o.status !== 'completed' && o.items.some(it => it.medId === medId));
                if (hasOpenOrder) {
                    return `<div class="apo-note" style="margin-bottom:16px;"><p>You can rate this once your order is completed or you confirm you received it.</p></div>`;
                }
                const alreadyRated = DB.reviews.some(r => r.customerId === custId && r.medId === medId);
                if (alreadyRated) {
                    return `<div class="apo-note" style="margin-bottom:16px;"><p>Thanks — you have already rated this remedy. Order it again to rate it again.</p></div>`;
                }
                return `<div class="apo-note" style="margin-bottom:16px;"><p>Only customers who received this remedy can rate it.</p></div>`;
            }

            return `<div class="card" style="background:var(--parchment);margin-bottom:16px;">
                  <div style="font-size:12.5px;font-weight:700;color:var(--walnut-soft);margin-bottom:8px;">
                    Rate this product (Order #${eligibleOrder.id.replace('o','')})
                  </div>
                  ${ratingWidget(medId, eligibleOrder.id)}
                </div>`;
        }

        /* -------------------- HELPERS -------------------- */
        function cartCount() {
            const c = state.carts[state.session.customer];
            if (!c) return 0;
            return c.items.reduce((n, it) => n + it.qty, 0);
        }

        function customerCart() {
            const cart = state.carts[state.session.customer];
            if (!cart || cart.items.length === 0) {
                return `<h2 class="section-title">Satchel</h2><div class="card empty">${illustration('mortar')}<div class="empty-title">Empty</div><button class="btn btn-primary" style="margin-top:16px;" onclick="App.setView('customer','home')">Browse</button></div>`;
            }
            const ph = pharmacy(cart.pharmacyId);
            let subtotal = 0;

                const m = medicine(it.medId);
                const lineTotal = m.price * it.qty;
                subtotal += lineTotal;
                return `<tr>
                  <td class="text-left"><div class="cell-with-thumb">${medPicture(m,52)}<span class="cell-text">${esc(m.name)}</span></div></td>
                  <td class="text-right">${money(m.price)}</td>
                  <td class="text-center"><div style="display:flex;align-items:center;justify-content:center;gap:8px;">
                      <button class="btn btn-ghost btn-sm" onclick="App.changeQty('${m.id}',-1)">−</button><span>${it.qty}</span>

                    </div></td>
                  <td class="text-right">${money(lineTotal)}</td>

            return `<h2 class="section-title">Satchel</h2>
                <div class="card">

                  <div class="table-wrap"><table>
                    <tr><th class="text-left">Item</th><th class="text-right">Price</th><th class="text-center">Qty</th><th class="text-right">Subtotal</th><th class="col-actions">Actions</th></tr>
                    ${rows}
                  </table></div>
                </div>
                <div class="card" style="max-width:340px;margin-top:14px;">
                  <div class="row-between"><span>Subtotal</span><strong>${money(subtotal)}</strong></div>

                  <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="App.setView('customer','checkout')">Checkout</button>
                </div>`;
        }

        function customerCheckout() {
            const cart = state.carts[state.session.customer];
            if (!cart || cart.items.length === 0) return `<div class="empty">Empty. <button class="btn-link" onclick="App.setView('customer','home')">Browse</button></div>`;
            const cust = currentCustomer();
            const ph = pharmacy(cart.pharmacyId);
            const subtotal = cart.items.reduce((s, it) => s + medicine(it.medId).price * it.qty, 0);
            const cfg = DB.settings;
            if (!cfg.pickupEnabled && state.checkout.fulfillment === 'pickup') state.checkout.fulfillment = 'delivery';
            if (!cfg.deliveryEnabled && state.checkout.fulfillment === 'delivery') state.checkout.fulfillment = 'pickup';
            const deliveryFee = state.checkout.fulfillment === 'delivery' ? deliveryFeeFor(subtotal) : 0;
            const total = subtotal + deliveryFee;
            return `<h2 class="section-title">Checkout</h2><p class="section-sub">From ${esc(pharmacyName(cart.pharmacyId))}</p>
                <div class="grid grid-2">
                  <div class="card">
                    <h3 style="margin-top:0;font-size:15px;">Fulfillment</h3>
                    <div class="chip-row">
                      ${cfg.pickupEnabled ? `<button class="chip ${state.checkout.fulfillment==='pickup'?'active':''}" onclick="App.setFulfillment('pickup')">${icon('building',14)} Pickup</button>` : ''}
                      ${cfg.deliveryEnabled ? `<button class="chip ${state.checkout.fulfillment==='delivery'?'active':''}" onclick="App.setFulfillment('delivery')">${icon('droplet',14)} Delivery (${deliveryFeeFor(subtotal)===0?'free':'+'+money(deliveryFeeFor(subtotal))})</button>` : ''}
                    </div>
                    ${cfg.deliveryEnabled && cfg.freeDeliveryOver > 0 ? `<p class="hint" style="margin-top:8px;">Free delivery on orders over ${money(cfg.freeDeliveryOver)}.</p>` : ''}

                      ? `<p class="hint" style="margin-top:12px;">Pick up at ${esc(ph ? ph.location : 'the pharmacy')}${ph ? ' — ' + esc(ph.hours) : ''}.</p>${pharmacyMapHtml(ph, 'checkoutPharmMap')}`
                      : `<div class="field" style="margin-top:14px;">
                          <label>Address</label>
                          <select onchange="App.setAddress(this.value)">
                            <option value="">Select address…</option>
                            ${cust.addresses.map(a=>`<option value="${a.id}" ${state.checkout.addressId===a.id?'selected':''}>${esc(a.label)} — ${esc(a.text)}</option>`).join('')}

                    ${paymentMethodFields()}

        /* ---------- Payment methods ---------- */
        const PAYMENT_METHODS = [
            { id: 'card', label: 'Card', icon: 'card' },
            { id: 'gcash', label: 'GCash', icon: 'wallet' },
            { id: 'paymaya', label: 'PayMaya', icon: 'wallet' },
            { id: 'paypal', label: 'PayPal', icon: 'globe' },
            { id: 'cod', label: 'Cash on Delivery', icon: 'cash' },
        ];
        const PAYMENT_HINT = {
            card: 'Card payment processed securely.',
            gcash: 'Pay with GCash.',
            paymaya: 'Pay with PayMaya.',
            paypal: 'Pay with PayPal.',
            cod: 'Pay in cash when your order is picked up or delivered.',
        };
        function paymentMethodPicker() {
            const methods = enabledPaymentMethods();
            if (!methods.length) return `<p class="hint">No payment method is currently enabled. Please contact support.</p>`;
            if (!methods.some(pm => pm.id === state.checkout.paymentMethod)) state.checkout.paymentMethod = methods[0].id;
            return `<div class="chip-row" style="margin-bottom:14px;">
                ${methods.map(pm => `<button class="chip pay-method ${state.checkout.paymentMethod===pm.id?'active':''}" onclick="App.setPaymentMethod('${pm.id}')">${icon(pm.icon,14)} ${pm.label}</button>`).join('')}
              </div>`;
        }
        function paymentMethodFields() {
            const method = state.checkout.paymentMethod;
            if (method === 'card') {
                return `<div class="field"><label>Card name</label><input type="text" id="cardName" placeholder="Juan Dela Cruz"></div>
                    <div class="field"><label>Card number</label><input type="text" id="cardNumber" placeholder="4242 4242 4242 4242"></div>
                    <div style="display:flex;gap:10px;">
                      <div class="field" style="flex:1;"><label>Expiry</label><input type="text" id="cardExpiry" placeholder="MM/YY"></div>
                      <div class="field" style="flex:1;"><label>CVV</label><input type="text" id="cardCvv" placeholder="123"></div>
                    </div>`;
            }
            if (method === 'gcash' || method === 'paymaya') {
                const brand = method === 'gcash' ? 'GCash' : 'PayMaya';
                return `<div class="field"><label>${brand}-registered mobile number</label><input type="text" id="ewalletNumber" placeholder="09XX XXX XXXX"></div>
                    <p class="hint">You'll get a one-time PIN in the ${brand} app to confirm this payment.</p>`;
            }
            if (method === 'paypal') {
                return `<div class="field"><label>PayPal email</label><input type="email" id="paypalEmail" placeholder="you@example.com"></div>
                    <p class="hint">You'll be redirected to PayPal to confirm this payment.</p>`;
            }
            return `<div class="apo-note" style="margin-top:4px;"><p>Have the exact amount ready — payment is collected in cash on pickup or delivery.</p></div>`;
        }

        function customerOrders() {
            const myOrders = DB.orders.filter(o => o.customerId === state.session.customer).sort((a, b) => b.createdAt - a
                .createdAt);
            if (myOrders.length === 0) return `<h2 class="section-title">My Orders</h2><div class="card empty">${illustration('mortar')}<div class="empty-title">No orders yet</div></div>`;
            return `<h2 class="section-title">My Orders</h2>
                <div class="card"><div class="table-wrap"><table>
                  <tr><th class="text-left">Order</th><th class="text-left">Pharmacy</th><th class="text-left">Fulfillment</th><th class="text-right">Total</th><th class="col-status">Status</th><th class="text-left">Placed</th><th class="col-actions">Actions</th></tr>
                  ${myOrders.map(o=>`<tr>
                    <td class="text-left">#${o.id.replace('o','')}</td><td class="text-left">${esc(pharmacyName(o.pharmacyId))}</td>
                    <td class="text-left" style="text-transform:capitalize;">${o.fulfillment}</td><td class="text-right">${money(orderTotal(o))}</td>
                    <td class="col-status"><span class="badge badge-${o.status}">${STATUS_LABEL[o.status]}</span></td><td class="text-left">${fmtDate(o.createdAt)}</td>
                    <td class="col-actions"><button class="btn btn-outline btn-sm" onclick="App.openOrder('customer','${o.id}')">View</button></td>
                  </tr>`).join('')}
                </table></div></div>`;
        }

        /* Order items keep a price snapshot, so a delisted medicine still renders sensibly. */
        function orderItemMed(it) {
            return medicine(it.medId) || { id: it.medId, name: 'Delisted item', category: 'Pain Relief',
                price: it.price, stock: 0, prescription: false };
        }

        function orderAddressText(o) {
            const c = customer(o.customerId);
            const addr = c && c.addresses ? c.addresses.find(a => a.id === o.addressId) : null;
            return addr ? addr.text : 'address on file';
        }

        function bloomTimeline(o) {
            if (o.status === 'cancelled') {
                return `<div class="apo-note" style="background:var(--danger-tint);border-color:#E0BDB4;transform:rotate(0.4deg);"><p style="color:var(--danger);font-family:var(--font-body);font-size:13.5px;font-weight:600;">This order was cancelled.</p></div>`;
            }
            const idx = Math.max(0, STATUS_FLOW.indexOf(o.status));
            const pct = (idx / (STATUS_FLOW.length - 1)) * 100;
            return `<div class="bloom-line">
                <div class="bloom-stem"><div class="bloom-stem-fill" style="width:${pct}%;"></div></div>
                <div class="bloom-steps">${STATUS_FLOW.map((s,i)=>{
                  const kind = i<idx ? 'done' : i===idx ? (i===STATUS_FLOW.length-1?'bloom':'current') : 'todo';
                  return `<div class="bloom-step ${i<idx?'done':''} ${i===idx?'current':''}">${flowerMarker(kind)}<div class="bloom-label">${STATUS_LABEL[s]}</div></div>`;
                }).join('')}</div>
              </div>`;
        }

        function customerOrderDetail() {
            const o = order(state.customer.orderId);
            if (!o) return `<div class="empty">Order not found.</div>`;
            const ph = pharmacy(o.pharmacyId);
            const relatedThread = DB.threads.find(t => t.orderId === o.id);
            return `<button class="btn-link" onclick="App.setView('customer','orders')">&larr; Back</button>
                <div class="card" style="margin-top:14px;">
                  <div class="row-between">
                    <h2 class="section-title" style="margin:0;">Order #${o.id.replace('o','')}</h2>
                    <span class="badge badge-${o.status}">${STATUS_LABEL[o.status]}</span>
                  </div>
                  <p class="section-sub">${esc(pharmacyName(o.pharmacyId))} · Placed ${fmtDate(o.createdAt)}</p>
                  ${bloomTimeline(o)}
                  <div class="divider"></div>
                  <table>
                    <tr><th class="text-left">Item</th><th class="text-center">Qty</th><th class="text-right">Subtotal</th></tr>
                    ${o.items.map(it=>{ const m=orderItemMed(it); return `<tr><td class="text-left"><div class="cell-with-thumb">${medPicture(m,46)}<span class="cell-text">${esc(m.name)}</span></div></td><td class="text-center">${it.qty}</td><td class="text-right">${money(it.price*it.qty)}</td></tr>`; }).join('')}
                    <tr><td colspan="2" class="text-left"><strong>Total</strong></td><td class="text-right"><strong>${money(orderTotal(o))}</strong></td></tr>
                  </table>
                  <div class="divider"></div>
                  <p style="font-size:14.5px;"><strong>Fulfillment:</strong> ${o.fulfillment==='pickup' ? 'Pickup at '+esc(ph ? ph.location : 'the pharmacy') : 'Delivery to '+esc(orderAddressText(o))}</p>
                  ${o.fulfillment==='pickup' ? pharmacyMapHtml(ph, 'orderDetailPharmMap') : ''}
                  <p style="font-size:14.5px;"><strong>Payment:</strong> <span class="pay-summary">${orderPaymentIcon(o)} ${esc(orderPaymentLabel(o))}</span></p>
                  <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-outline" onclick="${relatedThread ? `App.openThread('customer','${relatedThread.id}')` : `App.newOrderMessage('${o.id}')`}">${icon('quill',15)} Message pharmacist</button>
                    ${canConfirmReceipt(o) ? `<button class="btn btn-sage" onclick="App.confirmReceived('${o.id}')">${icon('leaf',15)} I received this order</button>` : ''}
                    ${o.status==='completed' && !orderReturn(o.id) ? `<button class="btn btn-ghost" onclick="App.requestReturn('${o.id}')">↩️ Request return / refund</button>` : ''}
                  </div>
                  ${orderReturn(o.id) ? `<div class="apo-note" style="margin-top:10px;"><p><strong>Return ${RETURN_LABEL[orderReturn(o.id).status]}</strong> — ${esc(orderReturn(o.id).reason)}${orderReturn(o.id).refundAmount!=null?` · ${money(orderReturn(o.id).refundAmount)} refunded`:''}</p></div>` : ''}
                  ${canConfirmReceipt(o) ? `<p class="hint" style="margin-top:8px;">Confirming receipt completes the order and unlocks rating for these items.</p>` : ''}
                </div>
                ${orderRatingSection(o)}`;
        }

        /* A customer may close the loop themselves once the pharmacy has the order ready. */
        function canConfirmReceipt(o) {
            return o.customerId === state.session.customer && (o.status === 'ready' || o.status === 'confirmed');
        }

        function orderRatingSection(o) {
            if (o.customerId !== state.session.customer) return '';
            if (o.status !== 'completed') {
                if (o.status === 'cancelled') return '';
                return `<div class="card" style="margin-top:14px;">
                    <h3 style="margin-top:0;font-size:15px;">Rate your medicines</h3>
                    <p class="hint">You can rate these items once the order is completed or you confirm you received them.</p>
                  </div>`;
            }
            return `<div class="card" style="margin-top:14px;">
                <h3 style="margin-top:0;font-size:15px;">Rate your medicines</h3>
                <p class="hint">Order received — tell the neighborhood how these worked out for you.</p>
                ${o.items.map(it => {
                  const m = orderItemMed(it);
                  const existing = DB.reviews.find(r => r.medId === it.medId && r.customerId === o.customerId && r.orderId === o.id);
                  return `<div class="review-item">
                      <div class="cell-with-thumb" style="margin-bottom:8px;">${medPicture(m,46)}<span class="cell-text"><strong>${esc(m.name)}</strong></span></div>
                      ${existing
                        ? `<div style="display:flex;align-items:center;gap:8px;">${starRow(existing.rating,null,14)}<span class="hint">Your rating · ${fmtDate(existing.at)}</span></div>`
                        : ratingWidget(it.medId, o.id)}
                    </div>`;
                }).join('')}
              </div>`;
        }

        /* Shared star picker used on the medicine page and inside a completed order. */
        function ratingWidget(medId, orderId) {
            const key = medId + '|' + orderId;
            const draft = state.reviewDraft[key] || { rating: 5 };
            return `<div class="star-input" role="radiogroup" aria-label="Rating">
                ${[1,2,3,4,5].map(i => `
                  <span onclick="App.setReviewRating('${medId}','${orderId}', ${i})"
                        style="cursor:pointer;"
                        role="radio"
                        aria-checked="${draft.rating === i}"
                        aria-label="${i} star${i===1?'':'s'}">
                    <svg viewBox="0 0 24 24" width="24" height="24"
                         fill="${draft.rating >= i ? 'var(--yarrow)' : 'none'}"
                         stroke="var(--yarrow)" stroke-width="1.5">${ICONS.star}</svg>
                  </span>`).join('')}
              </div>
              <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="App.submitReview('${medId}','${orderId}')">Submit Rating</button>`;
        }

        function customerMessages() {
            const myThreads = DB.threads.filter(t => t.customerId === state.session.customer);
            const uploadBtn =
                `<button class="btn btn-outline" style="margin-bottom:16px;" onclick="App.newPrescriptionUpload()">${icon('quill',15)} Upload Rx</button>`;
            if (myThreads.length === 0) return `<h2 class="section-title">Messages</h2>${uploadBtn}<div class="card empty">${illustration('mortar')}<div class="empty-title">No messages</div></div>`;
            return `<h2 class="section-title">Messages</h2>${uploadBtn}<div class="card">${myThreads.map(threadRow('customer')).join('')}</div>`;
        }

        function threadRow(role) {
            return function(t) {
                const last = t.messages[t.messages.length - 1];
                const ph = pharmacy(t.pharmacyId);
                const dotColor = t.type === 'prescription' ? 'var(--yarrow)' : 'var(--sage)';
                const hasImage = t.messages.some(m => m.image);
                const isUnread = role === 'customer' ? t.unreadForCustomer : t.unreadForStaff;
                let preview = 'No messages yet';
                if (last) {
                    if (last.text) preview = esc(last.text.slice(0, 58)) + (last.text.length > 58 ? '…' : '');
                    else if (last.image) preview = '📎 Rx photo attached';
                }
                return `<div class="row-between" style="padding:13px 0;border-bottom:1px solid var(--stone);cursor:pointer;" onclick="App.openThread('${role}','${t.id}')">
                  <div style="display:flex;gap:10px;align-items:flex-start;">
                    <span class="dot" style="background:${dotColor};margin-top:6px;"></span>
                    <div>
                      <div style="font-weight:700;font-size:13.5px;font-family:var(--font-display);">${isUnread?'<span class="row-unread-dot" title="New"></span>':''}${esc(t.subject)} ${hasImage?'📎':''}</div>
                      <div class="hint">${role==='customer' ? esc(ph ? ph.name : 'Pharmacy') : esc(customerName(t.customerId))} · ${preview}</div>
                    </div>
                  </div>
                  <span class="badge badge-${t.status}">${t.status}</span>
                </div>`;
            };
        }

        function threadView(role) {
            const id = state[role].threadId;
            const t = thread(id);
            if (!t) return `<div class="empty">Conversation not found.</div>`;
            return `<button class="btn-link" onclick="App.setView('${role}','messages')">&larr; Back</button>
                <div class="card" style="margin-top:14px;max-width:640px;">
                  <div class="row-between">
                    <h3 style="margin:0;font-family:var(--font-display);">${esc(t.subject)}</h3>
                    <span class="badge badge-${t.status}">${t.status}</span>
                  </div>
                  <p class="hint">${t.type==='prescription' ? 'Prescription inquiry' : 'Order-related'} · with ${role==='customer'?esc(pharmacyName(t.pharmacyId)):esc(customerName(t.customerId))}</p>
                  <div class="divider"></div>
                  <div>${t.messages.map(m=>`<div class="thread-msg ${m.from}">${m.image?`<img src="${m.image}" alt="Rx" onclick="App.openLightbox(this.src)">`:''}${m.text?esc(m.text):''}<div class="meta">${m.from==='staff'?'Pharmacy':'You'} · ${fmtDate(m.at)}</div></div>`).join('') || `<p class="hint">Say hello to start.</p>`}</div>
                  <div class="field" style="margin-top:14px;"><textarea id="msgText" placeholder="Type your message…"></textarea></div>
                  ${role==='customer' ? `
                    <div class="field">
                      ${state.pendingImage ? `<div class="img-preview"><img src="${state.pendingImage.dataUrl}" alt="Rx"><button onclick="App.clearPendingImage()">✕</button></div>`
                        : `<label class="upload-btn">${icon('quill',15)} Attach Rx photo<input type="file" accept="image/*" onchange="App.handleImageSelect(this)"></label>`}
                      <p class="hint">Upload a clear photo of the prescription.</p>
                    </div>` : ''}
                  <div class="row-between">
                    <button class="btn btn-primary" onclick="App.sendMessage('${role}','${t.id}')">Send</button>
                    ${role==='staff' && t.status==='open' ? `<button class="btn btn-sage btn-sm" onclick="App.resolveThread('${t.id}')">Mark resolved</button>` : ''}
                  </div>
                </div>`;
        }

        function customerProfile() {
            const c = currentCustomer();
            return `<h2 class="section-title">Profile</h2>
                <div class="grid grid-2">
                  <div class="card">
                    <h3 style="margin-top:0;font-size:15px;">Account</h3>
                    <div class="field"><label>Name</label><input type="text" id="custName" value="${esc(c.name)}"></div>
                    <div class="field"><label>Email</label><input type="email" id="custEmail" value="${esc(c.email)}"></div>
                    <button class="btn btn-primary" onclick="App.saveCustomerProfile()">Save</button>
                  </div>
                  <div class="card">
                    <h3 style="margin-top:0;font-size:15px;">Addresses</h3>
                    ${c.addresses.map(a=>`<div class="row-between" style="padding:9px 0;border-bottom:1px solid var(--stone);">
                        <div><strong>${esc(a.label)}</strong><div class="hint">${esc(a.text)}</div></div>
                        <button class="btn btn-ghost btn-sm" onclick="App.removeAddress('${a.id}')">Remove</button>
                      </div>`).join('') || `<p class="hint">No saved addresses.</p>`}
                    <div class="divider"></div>
                    <div class="field"><label>Label</label><input type="text" id="newAddrLabel" placeholder="Home, Office…"></div>
                    <div class="field"><label>Address</label><input type="text" id="newAddrText" placeholder="Street, district"></div>
                    <button class="btn btn-outline" onclick="App.addAddress()">Add</button>
                  </div>
                </div>`;
        }

        /* ================= STAFF ================= */
        function staffView() {
            const v = state.staff.view;
            if (v === 'orders') return staffOrders();
            if (v === 'orderDetail') return staffOrderDetail();
            if (v === 'listings') return staffListings();
            if (v === 'inventory') return staffInventory();
            if (v === 'returns') return staffReturns();
            if (v === 'notices') return staffNotifications();
            if (v === 'messages') return staffMessages();
            if (v === 'thread') return threadView('staff');
            if (v === 'sales') return staffSales();
            if (v === 'team') return isPharmacyOwner() ? staffTeam() : staffOrders();
            if (v === 'profile') return staffProfile();
            return '';
        }

        function staffOrders() {
            const ph = currentStaffPharmacy();
            const all = DB.orders.filter(o => o.pharmacyId === ph.id);
            const newOrders = all.filter(o => o.status === 'pending').length;
            const openMsgs = unreadForStaffPharmacy(ph.id);
            const lowStock = DB.medicines.filter(m => m.pharmacyId === ph.id && !m.prescription && m.stock <= 10).length;
            const filter = state.staff.orderFilter;
            const filtered = all.filter(o => filter === 'all' ? true :
                    filter === 'toPrepare' ? o.status === 'pending' :
                    filter === 'beingMade' ? (o.status === 'confirmed' || o.status === 'ready') :
                    o.status === filter)
                .sort((a, b) => b.createdAt - a.createdAt);
            return `<h2 class="section-title">Workbench</h2><p class="section-sub">${esc(ph.name)}</p>
                <div class="grid grid-stats" style="margin-bottom:18px;">
                  <div class="stat-jar"><div class="stat-num">${newOrders}</div><div class="stat-label">New Orders</div></div>
                  <div class="stat-jar"><div class="stat-num">${openMsgs}</div><div class="stat-label">Messages</div></div>
                  <div class="stat-jar"><div class="stat-num">${lowStock}</div><div class="stat-label">Low Stock</div></div>
                </div>
                <div class="chip-row" style="margin-bottom:14px;">
                  <button class="chip ${filter==='toPrepare'?'active':''}" onclick="App.setStaffFilter('toPrepare')">To Prepare</button>
                  <button class="chip ${filter==='beingMade'?'active':''}" onclick="App.setStaffFilter('beingMade')">Being Made</button>
                  <button class="chip ${filter==='completed'?'active':''}" onclick="App.setStaffFilter('completed')">Completed</button>
                  <button class="chip ${filter==='cancelled'?'active':''}" onclick="App.setStaffFilter('cancelled')">Cancelled</button>
                  <button class="chip ${filter==='all'?'active':''}" onclick="App.setStaffFilter('all')">All</button>
                </div>
                <div class="card">${filtered.length ? `<div class="table-wrap"><table>
                  <tr><th class="text-left">Order</th><th class="text-left">Customer</th><th class="text-left">Fulfillment</th><th class="text-right">Total</th><th class="col-status">Status</th><th class="text-left">Placed</th><th class="col-actions">Actions</th></tr>
                  ${filtered.map(o=>`<tr>
                    <td class="text-left">#${o.id.replace('o','')}</td><td class="text-left">${esc(customerName(o.customerId))}</td>
                    <td class="text-left" style="text-transform:capitalize;">${o.fulfillment}</td><td class="text-right">${money(orderTotal(o))}</td>
                    <td class="col-status"><span class="badge badge-${o.status}">${STATUS_LABEL[o.status]}</span></td><td class="text-left">${fmtDate(o.createdAt)}</td>
                    <td class="col-actions"><button class="btn btn-outline btn-sm" onclick="App.openOrder('staff','${o.id}')">Manage</button><button class="btn btn-ghost btn-sm" title="Print invoice" onclick="App.printDocument('${o.id}','invoice')">🧾</button></td>
                  </tr>`).join('')}
                </table></div>` : `<div class="empty">${illustration('mortar')}<div class="empty-title">Nothing here</div></div>`}</div>`;
        }

        function staffOrderDetail() {
            const o = order(state.staff.orderId);
            if (!o) return `<div class="empty">Order not found.</div>`;
            const idx = STATUS_FLOW.indexOf(o.status);
            const next = STATUS_FLOW[idx + 1];
            const relatedThread = DB.threads.find(t => t.orderId === o.id);
            const ret = orderReturn(o.id);
            return `<button class="btn-link" onclick="App.setView('staff','orders')">&larr; Back</button>
                <div class="card" style="margin-top:14px;">
                  <div class="row-between">
                    <h2 class="section-title" style="margin:0;">Order #${o.id.replace('o','')}</h2>
                    <span class="badge badge-${o.status}">${STATUS_LABEL[o.status]}</span>
                  </div>
                  <p class="section-sub">Customer: ${esc(customerName(o.customerId))} · ${fmtDate(o.createdAt)}</p>
                  ${bloomTimeline(o)}
                  <div class="divider"></div>
                  <table>
                    <tr><th class="text-left">Item</th><th class="text-center">Qty</th><th class="text-right">Subtotal</th></tr>
                    ${o.items.map(it=>{ const m=orderItemMed(it); return `<tr><td class="text-left"><div class="cell-with-thumb">${medPicture(m,46)}<span class="cell-text">${esc(m.name)}</span></div></td><td class="text-center">${it.qty}</td><td class="text-right">${money(it.price*it.qty)}</td></tr>`; }).join('')}
                    <tr><td colspan="2" class="text-left"><strong>Total</strong></td><td class="text-right"><strong>${money(orderTotal(o))}</strong></td></tr>
                  </table>
                  <div class="divider"></div>
                  <p style="font-size:14.5px;"><strong>Fulfillment:</strong> ${o.fulfillment==='pickup' ? 'Pickup' : 'Delivery to '+esc(orderAddressText(o))}</p>
                  <p style="font-size:14.5px;"><strong>Payment:</strong> <span class="pay-summary">${orderPaymentIcon(o)} ${esc(orderPaymentLabel(o))}</span></p>
                  <div class="divider"></div>
                  <div class="grid grid-2">
                    <div>
                      <h3 style="margin-top:0;font-size:15px;">Update status</h3>
                      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
                        <div class="field" style="flex:1;min-width:170px;margin-bottom:0;">
                          <label>Order status</label>
                          <select id="orderStatusSelect">
                            ${STATUS_FLOW.concat(['cancelled']).map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
                          </select>
                        </div>
                        <button class="btn btn-primary" onclick="App.setOrderStatus('${o.id}')">Apply</button>
                      </div>
                      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
                        ${next ? `<button class="btn btn-sage btn-sm" onclick="App.advanceOrder('${o.id}')">Mark as ${STATUS_LABEL[next]}</button>` : ''}
                        ${(o.status==='pending'||o.status==='confirmed') ? `<button class="btn btn-danger btn-sm" onclick="App.cancelOrder('${o.id}')">Cancel order</button>` : ''}
                        <button class="btn btn-outline btn-sm" onclick="${relatedThread ? `App.openThread('staff','${relatedThread.id}')` : `App.newOrderMessage('${o.id}')`}">${icon('quill',15)} Message customer</button>
                      </div>
                    </div>
                    <div>
                      <h3 style="margin-top:0;font-size:15px;">Documents &amp; returns</h3>
                      <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-outline btn-sm" onclick="App.printDocument('${o.id}','invoice')">🧾 Print invoice</button>
                        <button class="btn btn-outline btn-sm" onclick="App.printDocument('${o.id}','packing')">📦 Print packing slip</button>
                      </div>
                      ${ret ? `<div class="apo-note" style="margin-top:12px;">
                          <p><strong>Return ${RETURN_LABEL[ret.status]}</strong> — ${esc(ret.reason)}${ret.refundAmount!=null?` · Refunded ${money(ret.refundAmount)}`:''}</p>
                        </div>
                        <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="App.setView('staff','returns')">Open in Returns</button>`
                        : `<button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="App.staffOpenReturn('${o.id}')">↩️ Record return / refund</button>`}

        function staffSales() {
            const ph = currentStaffPharmacy();
            const orders = DB.orders.filter(o => o.pharmacyId === ph.id);
            const completed = orders.filter(o => o.status === 'completed');
            const cancelled = orders.filter(o => o.status === 'cancelled');
            const revenue = completed.reduce((s, o) => s + orderTotal(o), 0);
            const aov = completed.length ? revenue / completed.length : 0;
            const refunds = pharmacyReturns(ph.id).filter(r => r.status === 'refunded')
                .reduce((s, r) => s + (r.refundAmount || 0), 0);
            const days = state.staff.salesRange;
            const since = Date.now() - days * 864e5;
            const inRange = completed.filter(o => new Date(o.createdAt).getTime() >= since);
            const rangeRevenue = inRange.reduce((s, o) => s + orderTotal(o), 0);

            /* Product performance */
            const perf = {};
            completed.forEach(o => o.items.forEach(it => {
                if (!perf[it.medId]) perf[it.medId] = { units: 0, revenue: 0 };
                perf[it.medId].units += it.qty;
                perf[it.medId].revenue += it.price * it.qty;
            }));
            const perfRows = Object.entries(perf).map(([medId, p]) => ({ med: orderItemMed({ medId, price: 0 }), ...p }))
                .sort((a, b) => b.revenue - a.revenue);

            /* Customer insights */
            const byCustomer = {};
            orders.forEach(o => {
                if (!byCustomer[o.customerId]) byCustomer[o.customerId] = { orders: 0, spend: 0 };
                byCustomer[o.customerId].orders++;
                if (o.status === 'completed') byCustomer[o.customerId].spend += orderTotal(o);
            });
            const custRows = Object.entries(byCustomer).map(([id, c]) => ({ id, ...c }))
                .sort((a, b) => b.spend - a.spend);
            const repeat = custRows.filter(c => c.orders > 1).length;
            const avgItems = orders.length ? (orders.reduce((s, o) => s + o.items.reduce((n, it) => n + it.qty, 0), 0) /
                orders.length).toFixed(1) : '0.0';

            /* Daily trend over the selected range */
            const buckets = [];
            const span = Math.min(days, 14);
            for (let i = span - 1; i >= 0; i--) {
                const start = new Date();
                start.setHours(0, 0, 0, 0);
                start.setDate(start.getDate() - i);
                const end = new Date(start);
                end.setDate(end.getDate() + 1);
                const dayOrders = completed.filter(o => { const t = new Date(o.createdAt); return t >= start && t < end; });
                buckets.push({ label: start.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' }),
                    total: dayOrders.reduce((s, o) => s + orderTotal(o), 0) });
            }
            const maxBucket = Math.max(1, ...buckets.map(b => b.total));

            return `<h2 class="section-title">Sales &amp; Analytics</h2><p class="section-sub">${esc(ph.name)}</p>
                <div class="chip-row" style="margin-bottom:14px;">
                  ${[[7,'Last 7 days'],[30,'Last 30 days'],[365,'Last year']].map(([d,l])=>
                    `<button class="chip ${days===d?'active':''}" onclick="App.setSalesRange(${d})">${l}</button>`).join('')}
                </div>
                <div class="grid grid-stats" style="margin-bottom:16px;">
                  <div class="stat-card"><div class="stat-num">${money(rangeRevenue)}</div><div class="stat-label">Revenue (range)</div></div>
                  <div class="stat-card"><div class="stat-num">${money(revenue)}</div><div class="stat-label">Lifetime revenue</div></div>
                  <div class="stat-card"><div class="stat-num">${money(aov)}</div><div class="stat-label">Avg. order value</div></div>
                  <div class="stat-card"><div class="stat-num">${orders.length}</div><div class="stat-label">Total orders</div></div>
                  <div class="stat-card"><div class="stat-num">${cancelled.length}</div><div class="stat-label">Cancelled</div></div>
                  <div class="stat-card"><div class="stat-num">${money(refunds)}</div><div class="stat-label">Refunded</div></div>
                </div>
                <div class="card">
                  <h3 style="margin-top:0;font-size:15px;">Revenue trend</h3>
                  <div style="display:flex;align-items:flex-end;gap:6px;height:130px;">
                    ${buckets.map(b=>`<div style="flex:1;text-align:center;" title="${b.label}: ${money(b.total)}">
                        <div style="background:var(--terracotta);border-radius:6px 6px 0 0;height:${Math.max(3,(b.total/maxBucket)*100)}px;"></div>
                        <div style="font-size:10px;color:var(--walnut-faint);margin-top:4px;">${b.label}</div>
                      </div>`).join('')}
                  </div>
                </div>
                <div class="card">
                  <h3 style="margin-top:0;font-size:15px;">Product performance</h3>
                  ${perfRows.length ? `<div class="table-wrap"><table>
                    <tr><th class="text-left">Product</th><th class="text-right">Units sold</th><th class="text-right">Revenue</th><th class="text-right">In stock</th><th class="text-right">Rating</th></tr>
                    ${perfRows.map(r=>`<tr>

        /* ---- Phase 4: pharmacy admin manages their own staff accounts ---- */
        function staffTeam() {
            const ph = currentStaffPharmacy();
            const me = currentStaff();
            const team = pharmacyStaffList(ph.id);
            const owners = pharmacyOwners(ph.id);
            const canAddCoAdmin = owners.length < 2;
            const addingOrEditing = state.staff.addingStaff || state.staff.editStaffId;
            let formHtml = '';
            if (state.staff.addingStaff) {
                formHtml = `<div class="apo-note" style="margin-bottom:14px;">
                    <p>Create a login for a team member. They'll sign in with the email and password you set here — staff never register themselves.</p>
                  </div>
                  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;">
                    <div class="field" style="flex:1;min-width:160px;margin-bottom:0;"><label>Full name</label><input type="text" id="newStaffName" placeholder="Full name"></div>
                    <div class="field" style="flex:1;min-width:180px;margin-bottom:0;"><label>Email</label><input type="email" id="newStaffEmail" placeholder="name@${esc((ph.name||'pharmacy').toLowerCase().replace(/[^a-z0-9]+/g,''))}.ph"></div>
                    <div class="field" style="flex:1;min-width:140px;margin-bottom:0;"><label>Password</label><input type="text" id="newStaffPass" placeholder="Temporary password"></div>
                    <div class="field" style="min-width:170px;margin-bottom:0;"><label>Role</label>
                      <select id="newStaffRole">
                        <option value="staff">Staff</option>
                        <option value="owner" ${canAddCoAdmin ? '' : 'disabled'}>Co-Admin${canAddCoAdmin ? '' : ' (limit reached)'}</option>
                      </select>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="App.addStaffMember()">Create account</button>
                    <button class="btn btn-ghost btn-sm" onclick="App.cancelStaffForm()">Cancel</button>
                  </div>`;
            } else if (state.staff.editStaffId) {
                const s = staffMember(state.staff.editStaffId);
                if (s && s.pharmacyId === ph.id) {
                    formHtml = `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;">
                        <div class="field" style="flex:1;min-width:160px;margin-bottom:0;"><label>Full name</label><input type="text" id="editStaffName" value="${esc(s.name)}"></div>
                        <div class="field" style="flex:1;min-width:180px;margin-bottom:0;"><label>Email</label><input type="email" id="editStaffEmail" value="${esc(s.email)}"></div>
                        <div class="field" style="flex:1;min-width:140px;margin-bottom:0;"><label>Password</label><input type="text" id="editStaffPass" value="${esc(s.password)}"></div>
                        <button class="btn btn-primary btn-sm" onclick="App.saveStaffMember('${s.id}')">Save</button>
                        <button class="btn btn-ghost btn-sm" onclick="App.cancelStaffForm()">Cancel</button>
                      </div>`;
                }
            }
            return `<h2 class="section-title">Team</h2><p class="section-sub">${esc(ph.name)} — accounts are created by pharmacy admins only. Staff sign in with the credentials you give them.</p>
                <div class="card">
                  <div class="row-between">
                    <h3 style="margin:0;font-size:15px;">${icon('cross',15)} Staff accounts (${team.length})</h3>
                    ${!addingOrEditing ? `<button class="btn btn-primary btn-sm" onclick="App.startAddStaff()">Add staff account</button>` : ''}
                  </div>
                  <div class="divider"></div>
                  ${formHtml}
                  <div class="table-wrap"><table>
                    <tr><th class="text-left">Name</th><th class="text-left">Email</th><th class="col-status">Role</th><th class="col-status">Status</th><th class="col-actions">Actions</th></tr>
                    ${team.map(s=>`<tr>
                      <td class="text-left">${esc(s.name)}${s.id===me.id?' <span class="hint">(you)</span>':''}</td>
                      <td class="text-left">${esc(s.email)}</td>
                      <td class="col-status"><span class="badge ${s.isOwner?'badge-approved':'badge-active'}">${s.isOwner?'Admin':'Staff'}</span></td>
                      <td class="col-status"><span class="badge badge-${s.status==='active'?'active':'disabled'}">${s.status}</span></td>
                      <td class="col-actions">
                        <button class="btn btn-outline btn-sm" onclick="App.editStaffMember('${s.id}')">Edit</button>
                        ${s.id!==me.id ? `<button class="btn btn-ghost btn-sm" onclick="App.toggleStaffMemberStatus('${s.id}')">${s.status==='active'?'Disable':'Activate'}</button>` : ''}
                        ${s.id!==me.id && !(s.isOwner && owners.length<=1) ? `<button class="btn btn-danger btn-sm" onclick="App.removeStaffMember('${s.id}')">Remove</button>` : ''}
                      </td>
                    </tr>`).join('')}
                  </table></div>
                  <p class="hint" style="margin-top:10px;">Each pharmacy can have up to two admins. The last remaining admin of a pharmacy can't be removed here — contact the site admin if ownership needs to change.</p>
                </div>`;
        }

        /* ================= ADMIN ================= */
        function adminView() {
            const v = state.admin.view;
            if (v === 'approvals') return adminApprovals();
            if (v === 'accounts') return adminAccounts();
            if (v === 'catalog') return adminCatalog();
            if (v === 'orders') return adminOrders();
            if (v === 'flags') return adminFlags();
            if (v === 'reports') return adminReports();
            if (v === 'content') return adminContent();
            if (v === 'audit') return adminAuditTrail();
            if (v === 'settings') return adminSettings();
            return '';
        }

        function adminApprovals() {
            const pending = DB.staff.filter(s => s.status === 'pending');

                return `<h2 class="section-title">Registry</h2>
                <div class="card empty">${illustration('mortar')}<div class="empty-title">All caught up</div>No pending registrations.</div>`;

            return `<h2 class="section-title">Registry</h2><p class="section-sub">New pharmacies waiting for approval.</p>
                <div class="card">${pending.map(s=>{
                  const ph = pharmacy(s.pharmacyId);
                  return `<div class="row-between" style="padding:15px 0;border-bottom:1px solid var(--stone);">
                    <div style="display:flex;gap:12px;align-items:flex-start;">
                      <span style="color:var(--terracotta);margin-top:2px;">${icon('building',20)}</span>
                      <div>
                        <strong style="font-family:var(--font-display);">${ph ? esc(ph.name) : 'Unknown'}</strong><br>
                        <span class="hint">${ph ? esc(ph.location) : ''} · ${ph ? esc(ph.hours) : ''}</span><br>

                        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">

                          <div class="field" style="flex:1;min-width:180px;margin-bottom:0;"><label>Email</label><input type="email" id="admCustEmail" value="${esc(c.email)}"></div>
                          <div class="field" style="min-width:150px;margin-bottom:0;"><label>Status</label>
                            <select id="admCustStatus">
                              <option value="active" ${c.status==='active'?'selected':''}>Active</option>
                              <option value="disabled" ${c.status!=='active'?'selected':''}>Suspended</option>

                          </div>

                      </td></tr>`;

                      <td class="text-left">${esc(c.name)}</td><td class="text-left">${esc(c.email)}</td>
                      <td class="text-right">${orders}</td>

                        <button class="btn btn-danger btn-sm" onclick="App.removeAccount('customer','${c.id}')">Remove</button>
                      </td>
                    </tr>`;
                    }).join('')}
                  </table></div>
                </div>
                ${adminAccountsPanel()}
                <div class="card">

                  <div class="table-wrap"><table>
                    <tr><th class="text-left">Person</th><th class="text-left">Pharmacy</th><th class="col-status">Role</th><th class="col-status">Status</th><th class="col-status">Pharmacy</th><th class="col-actions">Actions</th></tr>
                    ${DB.staff.map(s=>{
                      const ph = pharmacy(s.pharmacyId);
                      const phStatus = ph ? ph.status : 'orphaned';
                      return `<tr>
                        <td class="text-left">${esc(s.name)}<br><span class="hint">${esc(s.email)}</span></td>

                        <td class="col-actions">

            return `<div class="card">

                  }).join('')}

        function avgResponseHours() {
            let diffs = [];
            DB.threads.forEach(t => {
                const firstCust = t.messages.find(m => m.from === 'customer');
                const firstStaff = t.messages.find(m => m.from === 'staff');
                if (firstCust && firstStaff && firstStaff.at > firstCust.at) { diffs.push((firstStaff.at - firstCust
                        .at) / 36e5); }
            });
            if (diffs.length === 0) return null;
            return (diffs.reduce((a, b) => a + b, 0) / diffs.length).toFixed(1);
        }

                user = DB.customers.find(u => u.email.toLowerCase() === email && u.password === pass);
                if (user) role = 'customer';
                if (!user) { user = DB.staff.find(u => u.email.toLowerCase() === email && u.password === pass); if (user)
                        role = 'staff'; }
                if (!user) { user = DB.admins.find(u => u.email.toLowerCase() === email && u.password === pass); if (user)
                        role = 'admin'; }
                if (!user) { toast('Invalid email or password.', 'error'); return; }

                if (role === 'staff' && user.status === 'rejected') { toast(

                if (role !== 'admin' && user.status === 'disabled') { toast(

            /* ---- REVIEW ACTIONS (no comments) ---- */
            setReviewRating(medId, orderId, rating) {
                const key = medId + '|' + orderId;
                if (!state.reviewDraft[key]) state.reviewDraft[key] = { rating: 5 };
                state.reviewDraft[key].rating = rating;
                update();
            },
            submitReview(medId, orderId) {
                const custId = state.session.customer;
                const key = medId + '|' + orderId;
                const draft = state.reviewDraft[key] || { rating: 5 };
                const rating = Math.min(5, Math.max(1, draft.rating));

                // Ratings are only allowed on an order this customer has actually received.
                const o = order(orderId);
                if (!o || o.customerId !== custId || o.status !== 'completed' ||
                    !o.items.some(it => it.medId === medId)) {
                    toast('You can only rate medicines from a completed order.', 'error');
                    return;
                }

                // Check if already reviewed for this order
                const existing = DB.reviews.find(r => r.medId === medId && r.customerId === custId && r
                    .orderId === orderId);
                if (existing) {
                    toast('You already rated this product for this order.', 'error');
                    return;
                }

                const id = 'rv' + (counters.review++);
                const rev = {
                    id,
                    medId,
                    customerId: custId,
                    orderId,
                    rating,
                    at: new Date()
                };
                DB.reviews.push(rev);
                sbUpsert('reviews', rev);
                delete state.reviewDraft[key];
                toast('Thank you for your rating! 🌟', 'success');
                update();
            },

            addToCartFX(fromEl) {
                try {
                    const cartIcon = document.getElementById('satchelIcon');
                    if (!fromEl || !cartIcon) return;
                    const startRect = fromEl.getBoundingClientRect();
                    const endRect = cartIcon.getBoundingClientRect();
                    const particle = document.createElement('div');
                    particle.className = 'fly-particle';
                    particle.style.left = (startRect.left + startRect.width / 2 - 8) + 'px';
                    particle.style.top = (startRect.top + startRect.height / 2 - 8) + 'px';
                    document.body.appendChild(particle);
                    requestAnimationFrame(() => {
                        particle.style.transform =
                            `translate(${endRect.left-startRect.left}px, ${endRect.top-startRect.top}px) scale(.2)`;
                        particle.style.opacity = '0';
                    });
                    setTimeout(() => particle.remove(), 550);
                    for (let i = 0; i < 4; i++) {
                        const p = document.createElement('span');
                        p.className = 'petal-particle';
                        p.style.left = (startRect.left + startRect.width / 2) + 'px';
                        p.style.top = (startRect.top + startRect.height / 2) + 'px';
                        p.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
                        p.style.setProperty('--dy', (Math.random() * -45 - 10) + 'px');
                        document.body.appendChild(p);
                        setTimeout(() => p.remove(), 650);
                    }
                } catch (e) {}
            },

            addToCart(medId, fromEl) {
                const m = medicine(medId);
                if (!m || m.prescription || m.stock === 0) return;
                const custId = state.session.customer;
                let cart = state.carts[custId];
                if (cart && cart.pharmacyId !== m.pharmacyId && cart.items.length > 0) {
                    const ok = confirm('Your satchel has items from another pharmacy. Clear and start new order?');
                    if (!ok) return;
                    cart = null;
                }
                if (!cart) { cart = { pharmacyId: m.pharmacyId, items: [] };
                    state.carts[custId] = cart; }
                const existing = cart.items.find(it => it.medId === medId);
                if (existing) {
                    if (existing.qty < m.stock) existing.qty++;
                    else { toast('No more stock.', 'error'); return; }
                } else { cart.items.push({ medId, qty: 1 }); }
                App.addToCartFX(fromEl);
                toast(m.name + ' added.', 'success');
                update();
            },
            changeQty(medId, delta) {
                const cart = state.carts[state.session.customer];
                if (!cart) return;
                const item = cart.items.find(it => it.medId === medId);
                if (!item) return;
                const m = medicine(medId);
                item.qty += delta;
                if (item.qty <= 0) { cart.items = cart.items.filter(it => it.medId !== medId); } else if (item.qty > m
                    .stock) { item.qty = m.stock;
                    toast('Only ' + m.stock + ' in stock.', 'error'); }
                update();
            },
            removeFromCart(medId) {
                const cart = state.carts[state.session.customer];
                if (!cart) return;
                cart.items = cart.items.filter(it => it.medId !== medId);
                update();
            },
            setFulfillment(v) { state.checkout.fulfillment = v;
                update(); },
            setAddress(id) { state.checkout.addressId = id || null;
                update(); },

            placeOrder() {
                if (state.checkout.processing) return;
                const custId = state.session.customer;
                const cart = state.carts[custId];
                if (!cart || cart.items.length === 0) { toast('Satchel is empty.', 'error'); return; }
                if (state.checkout.fulfillment === 'delivery' && !state.checkout.addressId) { toast(
                        'Select a delivery address.', 'error'); return; }

                const method = state.checkout.paymentMethod || 'card';
                let paymentLabel = '';
                if (method === 'card') {
                    const cardName = (document.getElementById('cardName') || {}).value?.trim();
                    const cardNumber = (document.getElementById('cardNumber') || {}).value?.trim();
                    const cardExpiry = (document.getElementById('cardExpiry') || {}).value?.trim();
                    const cardCvv = (document.getElementById('cardCvv') || {}).value?.trim();
                    if (!cardName || !cardNumber || !cardExpiry || !cardCvv) { toast(
                            'Complete card details.', 'error'); return; }
                    paymentLabel = 'Card •••• ' + cardNumber.replace(/\s/g, '').slice(-4);
                } else if (method === 'gcash' || method === 'paymaya') {
                    const brand = method === 'gcash' ? 'GCash' : 'PayMaya';
                    const num = (document.getElementById('ewalletNumber') || {}).value?.trim();
                    if (!num || num.replace(/\D/g, '').length < 10) { toast(
                            'Enter a valid ' + brand + ' mobile number.', 'error'); return; }
                    paymentLabel = brand + ' •••• ' + num.replace(/\D/g, '').slice(-4);
                } else if (method === 'paypal') {
                    const email = (document.getElementById('paypalEmail') || {}).value?.trim();
                    if (!email || !email.includes('@')) { toast('Enter a valid PayPal email.', 'error'); return; }
                    paymentLabel = 'PayPal (' + email + ')';
                } else if (method === 'cod') {
                    paymentLabel = 'Cash on Delivery';
                }

                state.checkout.processing = true;
                state.checkout._pending = { method, paymentLabel };
                update();
                const gatewayName = { card: 'Stripe', paypal: 'PayPal', gcash: 'GCash', paymaya: 'PayMaya' }[method];
                toast(gatewayName ? 'Processing payment via ' + gatewayName + '…' : 'Confirming order…', 'success');
                setTimeout(() => App.finalizeOrder(), 1100);
            },

            finalizeOrder() {
                const custId = state.session.customer;
                const cart = state.carts[custId];
                if (!cart) { state.checkout.processing = false;
                    update();
                    return; }
                const pending = state.checkout._pending || {};
                const id = 'o' + (counters.order++);
                const items = cart.items.map(it => ({ medId: it.medId, qty: it.qty, price: medicine(it.medId)
                        .price }));
                items.forEach(it => { const med = medicine(it.medId);
                    med.stock -= it.qty;
                    med.sold = (med.sold || 0) + it.qty; });
                const newOrder = { id, customerId: custId, pharmacyId: cart.pharmacyId, items, fulfillment: state
                        .checkout.fulfillment, addressId: state.checkout.addressId, status: 'pending',
                    createdAt: new Date(), paymentMethod: pending.method || 'card',
                    paymentLabel: pending.paymentLabel || 'Card' };
                DB.orders.push(newOrder);
                items.forEach(it => { const med = medicine(it.medId); if (med) sbUpsert('medicines', med); });
                sbUpsert('orders', newOrder);
                notifyOrderEvent(order(id), 'orderPlaced');
                delete state.carts[custId];
                state.checkout = { fulfillment: 'pickup', addressId: null, paymentMethod: 'card', processing: false };
                state.customer.view = 'orders';
                toast('Order #' + id.replace('o', '') + ' placed!', 'success');
                update();

                if (o.status === 'cancelled' || o.status === 'pending') { toast(

                o.status = 'completed';

            addMedicine() {

                const price = parseFloat((document.getElementById('medPrice') || {}).value);

                    price, stock, prescription: isRx, sold: 0, addedAt: newestAddedAt + 1,
                    description: description || undefined,
                    specs: { Category: isRx ? 'Prescription' : category, 'Requires Prescription': isRx ? 'Yes' : 'No',
                        'Sold By': ph.name } };
                DB.medicines.push(newMed);

            savePharmacyProfile() {
                const ph = currentStaffPharmacy();
                const name = (document.getElementById('phName') || {}).value?.trim();
                const location = (document.getElementById('phLocation') || {}).value?.trim();
                const hours = (document.getElementById('phHours') || {}).value?.trim();
                const latRaw = (document.getElementById('phLat') || {}).value?.trim();
                const lngRaw = (document.getElementById('phLng') || {}).value?.trim();
                if (!name || !location || !hours) { toast('All fields required.', 'error'); return; }
                if (!!latRaw !== !!lngRaw) { toast('Fill in both latitude and longitude, or leave both blank.', 'error'); return; }
                let lat = null, lng = null;
                if (latRaw && lngRaw) {
                    lat = parseFloat(latRaw);
                    lng = parseFloat(lngRaw);
                    if (isNaN(lat) || lat < -90 || lat > 90 || isNaN(lng) || lng < -180 || lng > 180) {
                        toast('Latitude/longitude look invalid.', 'error');
                        return;
                    }
                }
                ph.name = name;
                ph.location = location;
                ph.hours = hours;
                ph.lat = lat;
                ph.lng = lng;
                sbUpsert('pharmacies', ph);
                toast('Profile updated.', 'success');

            geocodePharmacyAddress() {
                if (!mapsReady || typeof L === 'undefined') { toast('Map is still loading — try again in a moment.', 'error'); return; }
                const address = (document.getElementById('phLocation') || {}).value?.trim();
                if (!address) { toast('Type an address first.', 'error'); return; }
                toast('Looking up address…', 'success');
                // Free OpenStreetMap Nominatim geocoder (no API key). Please keep usage modest.
                const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address);
                fetch(url, { headers: { 'Accept': 'application/json' } })
                    .then(r => r.json())
                    .then(results => {
                        if (!results || !results.length) { toast('Could not find that address on the map.', 'error'); return; }
                        const lat = parseFloat(results[0].lat);
                        const lng = parseFloat(results[0].lon);
                        if (pharmMap && pharmMarker) {
                            pharmMap.setView([lat, lng], 17);
                            pharmMarker.setLatLng([lat, lng]);
                        }
                        setPharmLatLngFields(lat, lng);
                        toast('Pin placed — drag it to fine-tune.', 'success');
                    })
                    .catch(() => toast('Could not look up that address. Check your connection.', 'error'));
            },

            /* ---- Phase 4: pharmacy admin manages their own staff ---- */

            cancelStaffForm() { state.staff.addingStaff = false;

            addStaffMember() {
                if (!isPharmacyOwner()) { toast('Only a pharmacy admin can add staff.', 'error'); return; }
                const ph = currentStaffPharmacy();
                const name = (document.getElementById('newStaffName') || {}).value?.trim();

                const role = (document.getElementById('newStaffRole') || {}).value || 'staff';
                if (!name || !email || !password) { toast('Fill in all fields.', 'error'); return; }
                const emailTaken = DB.staff.some(s => s.email.toLowerCase() === email.toLowerCase()) ||
                    DB.customers.some(c => c.email.toLowerCase() === email.toLowerCase()) ||
                    DB.admins.some(a => a.email.toLowerCase() === email.toLowerCase());
                if (emailTaken) { toast('That email is already in use.', 'error'); return; }
                const isOwner = role === 'owner';
                if (isOwner && pharmacyOwners(ph.id).length >= 2) { toast('This pharmacy already has two admins.',

                    ' ')[0] + '.', 'success');

                const password = (document.getElementById('editStaffPass') || {}).value?.trim();
                if (!name || !email || !password) { toast('Fill in all fields.', 'error'); return; }

                s.email = email;

            toggleAccount(type, id) {

                if (type === 'staff' && rec.status === 'pending') {
                    toast('Cannot toggle pending — approve or reject first.', 'error');
                    return;
                }
                rec.status = rec.status === 'active' ? 'disabled' : 'active';
                if (type === 'staff' && rec.isOwner) {
                    const ph = pharmacy(rec.pharmacyId);
                    if (ph) {
                        ph.status = rec.status === 'active' ? 'approved' : 'rejected';
                        sbUpsert('pharmacies', ph);
                    }
                }
                sbUpsert(type === 'customer' ? 'customers' : 'staff', rec);
                logAudit((rec.status === 'active' ? 'Activated' : 'Disabled') + ' ' + type + ' account ' +
                    (rec.name || rec.email));
                toast('Account ' + (rec.status === 'active' ? 'activated' : 'disabled') + '.', 'success');

                    DB.orders = DB.orders.filter(o => o.customerId !== id);
                    logAudit('Removed customer account ' + (c ? c.name : id));
                    toast('Customer removed.', 'success');
                } else if (type === 'staff') {
                    const s = staffMember(id);
                    if (s) {
                        const ph = pharmacy(s.pharmacyId);
                        const remainingOwners = ph ? pharmacyOwners(ph.id).filter(o => o.id !== id).length : 0;
                        if (s.isOwner && ph && remainingOwners === 0) {
                            // Removing the last admin closes the pharmacy entirely, same as before.
                            DB.pharmacies = DB.pharmacies.filter(p => p.id !== ph.id);
                            DB.medicines = DB.medicines.filter(m => m.pharmacyId !== ph.id);

                    o.items.forEach(it => { const med = medicine(it.medId);

            requestReturn(orderId) {
                const o = order(orderId);
                if (!o || o.customerId !== state.session.customer) { toast('Order not found.', 'error'); return; }
                if (orderReturn(orderId)) { toast('A return is already on file for this order.', 'error'); return; }
                const days = (Date.now() - new Date(o.createdAt).getTime()) / 864e5;
                if (days > DB.settings.returnWindowDays) {
                    toast('The ' + DB.settings.returnWindowDays + '-day return window has closed.', 'error');
                    return;
                }
                const reason = prompt('Why are you returning this order?');
                if (!reason || !reason.trim()) return;
                const rr = { id: 'r' + (counters.ret++), orderId, customerId: o.customerId,
                    pharmacyId: o.pharmacyId, reason: reason.trim(), status: 'requested', refundAmount: null,
                    at: new Date(), source: 'customer' };
                DB.returns.push(rr); sbUpsert('returns', rr);
                toast('Return request sent to the pharmacy.', 'success');
                update();
            },
            staffOpenReturn(orderId) {
                const o = order(orderId);
                if (!o) { toast('Order not found.', 'error'); return; }
                if (orderReturn(orderId)) { toast('A return already exists for this order.', 'error'); return; }
                const reason = prompt('Reason for the return / refund:');
                if (!reason || !reason.trim()) return;
                const rr2 = { id: 'r' + (counters.ret++), orderId, customerId: o.customerId,
                    pharmacyId: o.pharmacyId, reason: reason.trim(), status: 'approved', refundAmount: null,
                    at: new Date(), source: 'staff' };
                DB.returns.push(rr2); sbUpsert('returns', rr2);
                toast('Return recorded — issue the refund from the Returns tab.', 'success');

            approveReturn(id) {
                const r = DB.returns.find(x => x.id === id);

                r.status = 'approved';
                sbUpsert('returns', r);
                toast('Return approved.', 'success');
                App.notifyReturn(r);
                update();
            },
            rejectReturn(id) {
                const r = DB.returns.find(x => x.id === id);
                if (!r) return;
                if (!confirm('Reject this return request?')) return;
                r.status = 'rejected';
                sbUpsert('returns', r);
                toast('Return rejected.', 'success');
                App.notifyReturn(r);
                update();
            },
            refundReturn(id) {
                const r = DB.returns.find(x => x.id === id);
                if (!r) return;
                const o = order(r.orderId);
                const suggested = o ? orderTotal(o) : 0;
                const value = prompt('Refund amount', suggested.toFixed(2));
                if (value === null) return;
                const amount = parseFloat(value);
                if (isNaN(amount) || amount < 0) { toast('Enter a valid amount.', 'error'); return; }
                r.status = 'refunded';
                r.refundAmount = amount;
                if (o && confirm('Return the items to stock?')) {
                    o.items.forEach(it => { const m = medicine(it.medId);
                        if (m) { m.stock += it.qty;
                            m.sold = Math.max(0, (m.sold || 0) - it.qty);
                            sbUpsert('medicines', m); } });
                }
                sbUpsert('returns', r);
                toast('Refund of ' + money(amount) + ' issued.', 'success');
                App.notifyReturn(r);
                update();

            },

            startAddPromo() { state.admin.addingPromo = true;
                state.admin.editPromoId = null;
                update(); },
            cancelPromoForm() { state.admin.addingPromo = false;
                state.admin.editPromoId = null;
                update(); },
            addPromo() {
                const title = (document.getElementById('newPromoTitle') || {}).value?.trim();
                const text = (document.getElementById('newPromoText') || {}).value?.trim();
                if (!title || !text) { toast('Fill in both fields.', 'error'); return; }
                const np = { id: 'promo' + (counters.promo++), title, text, active: true };
                DB.promotions.push(np); sbUpsert('promotions', np);
                state.admin.addingPromo = false;
                logAudit('Added promotion: ' + title);
                toast('Promotion added.', 'success');
                update();
            },
            editPromo(id) { state.admin.editPromoId = id;
                state.admin.addingPromo = false;
                update(); },
            savePromo(id) {
                const p = DB.promotions.find(x => x.id === id);
                if (!p) { toast('Promotion not found.', 'error'); return; }
                const title = (document.getElementById('editPromoTitle') || {}).value?.trim();
                const text = (document.getElementById('editPromoText') || {}).value?.trim();
                if (!title || !text) { toast('Fill in both fields.', 'error'); return; }
                p.title = title;
                p.text = text;
                sbUpsert('promotions', p);
                state.admin.editPromoId = null;
                logAudit('Updated promotion: ' + title);
                toast('Promotion updated.', 'success');
                update();
            },
            togglePromo(id) {
                const p = DB.promotions.find(x => x.id === id);
                if (!p) return;
                p.active = !p.active;
                sbUpsert('promotions', p);
                logAudit((p.active ? 'Activated' : 'Deactivated') + ' promotion: ' + p.title);
                toast('Promotion ' + (p.active ? 'activated' : 'deactivated') + '.', 'success');
                update();
            },
            removePromo(id) {
                const p = DB.promotions.find(x => x.id === id);
                if (!confirm('Remove this promotion?')) return;
                DB.promotions = DB.promotions.filter(x => x.id !== id);
                sbDelete('promotions', id);
                logAudit('Removed promotion: ' + (p ? p.title : id));
                toast('Promotion removed.', 'success');
                update();
            },

            /* =====================================================
               PHASE 4 — ADMIN: Audit Trail
               ===================================================== */
            setAuditFilter(v) { state.admin.auditFilter = v;
                update(); },
        };

        (async function boot() {
            if (sbEnabled()) {
                // Upload built-in accounts if the remote project is still empty
                const seeded = await seedSupabaseIfEmpty();
                const loaded = await loadAllFromSupabase();
                if (!loaded) {
                    console.warn('[Supabase] Could not load — using local data. Did you run the SQL schema?');
                } else if (seeded) {
                    await loadAllFromSupabase();
                }
                setupRealtimeThreads();
                setupRealtimeOrders();
                setupRealtimeNotifications();
                toast('Connected to Supabase — changes sync to the database.', 'success');
            }
            update();
        })();
    </script>
</body>
</html>
